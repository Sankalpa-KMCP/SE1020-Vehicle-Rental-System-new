<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriveAway | Contact Us</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #FAFAFA; overflow-x: hidden; padding-top: 5rem; }
    .gradient-text {
      background: linear-gradient(135deg, #0D6EFD 0%, #4A12DA 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s cubic-bezier(0.2,0.8,0.2,1); }
    .reveal.active { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body class="text-gray-900 antialiased">
<th:block th:replace="~{fragments/layout :: globalPreloader}"></th:block>
<div th:replace="~{fragments/layout :: publicNav}"></div>
<main class="relative z-10">
  <section class="pt-24 pb-16">
    <div class="max-w-[1400px] mx-auto px-6 lg:px-8 text-center">
      <div class="reveal">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4">Get in <span class="gradient-text">Touch</span></h1>
        <p class="text-xl text-gray-500 max-w-2xl mx-auto font-medium">Have a question about our fleet? Our team is ready to help.</p>
      </div>
    </div>
  </section>
  <section class="pb-24">
    <div class="max-w-[1400px] mx-auto px-6 lg:px-8 grid lg:grid-cols-2 gap-12">
      <div class="reveal space-y-6">
        <h2 class="text-2xl font-extrabold">Contact Information</h2>
        <p class="text-gray-600 font-medium">123 Galle Road, Colombo 03, Sri Lanka</p>
        <p class="text-gray-600 font-medium">+94 11 234 5678</p>
        <p class="text-gray-600 font-medium">hello@driveaway.lk</p>
      </div>
      <div class="reveal bg-white p-8 rounded-3xl shadow-lg border border-gray-100">
        <h2 class="text-2xl font-extrabold mb-6">Send a Message</h2>
        <form id="contactForm" class="space-y-4" onsubmit="event.preventDefault(); document.getElementById('formStatus').classList.remove('hidden');">
          <input type="text" name="name" required placeholder="Full Name" class="w-full border border-gray-200 rounded-xl px-4 py-3"/>
          <input type="email" name="email" required placeholder="Email" class="w-full border border-gray-200 rounded-xl px-4 py-3"/>
          <textarea name="message" rows="4" required placeholder="Message" class="w-full border border-gray-200 rounded-xl px-4 py-3"></textarea>
          <button type="submit" class="w-full bg-[#0D6EFD] text-white font-bold py-4 rounded-2xl">Send Message</button>
        </form>
        <div id="formStatus" class="mt-4 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 font-bold text-center hidden">Thank you! We will get back to you soon.</div>
      </div>
    </div>
  </section>
</main>
<div th:replace="~{fragments/layout :: publicFooter}"></div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  });
</script>
</body>
</html>
