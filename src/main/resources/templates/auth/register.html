<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriveAway | Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #FAFAFA; overflow-x: hidden; padding-top: 5rem; }
    .gradient-text {
      background: linear-gradient(135deg, #0D6EFD 0%, #4A12DA 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>
</head>
<body class="text-gray-900 antialiased">
<div th:replace="~{fragments/layout :: publicNav}"></div>
<main class="max-w-3xl mx-auto px-6 lg:px-8 pb-24">
  <header class="text-center pt-8 mb-10">
    <h1 class="text-4xl font-extrabold mb-2">Create your <span class="gradient-text">account</span></h1>
    <p class="text-gray-500">Join DriveAway to browse the fleet and manage bookings online.</p>
  </header>
  <div th:if="${error}" class="mb-6 bg-red-50 text-red-700 text-sm p-4 rounded-xl border border-red-100 font-semibold text-center" th:text="${error}"></div>
  <div th:if="${param.error != null and param.error[0] == 'username_taken'}" class="mb-6 bg-red-50 text-red-700 text-sm p-4 rounded-xl border border-red-100 font-semibold text-center">
    That username is already taken. Pick another.
  </div>
  <form method="post" th:action="@{/auth/register}" class="bg-white rounded-3xl shadow-xl border border-gray-100 p-8 md:p-10 space-y-5">
    <div class="grid md:grid-cols-2 gap-5">
      <label class="block text-sm font-bold text-gray-700">Full name
        <input type="text" name="name" required class="mt-1 w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"/>
      </label>
      <label class="block text-sm font-bold text-gray-700">Email
        <input type="email" name="email" required class="mt-1 w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"/>
      </label>
    </div>
    <div class="grid md:grid-cols-2 gap-5">
      <label class="block text-sm font-bold text-gray-700">Username
        <input type="text" name="username" required class="mt-1 w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"/>
      </label>
      <label class="block text-sm font-bold text-gray-700">Password
        <input type="password" name="password" required class="mt-1 w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"/>
      </label>
    </div>
    <label class="block text-sm font-bold text-gray-700">Phone
      <input type="text" name="phone" required class="mt-1 w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"/>
    </label>
    <div class="grid md:grid-cols-2 gap-5">
      <label class="block text-sm font-bold text-gray-700">NIC (optional)
        <input type="text" name="nic" class="mt-1 w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"/>
      </label>
      <label class="block text-sm font-bold text-gray-700">License (optional)
        <input type="text" name="license" class="mt-1 w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"/>
      </label>
    </div>
    <div class="flex flex-col sm:flex-row gap-4 pt-4">
      <button type="submit" class="flex-1 bg-[#0D6EFD] hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-xl transition shadow-lg shadow-blue-500/25">
        Register
      </button>
      <a th:href="@{/auth/login}" class="transition-link flex-1 text-center border-2 border-gray-200 text-gray-800 font-bold py-3.5 rounded-xl hover:bg-gray-50 transition">
        Back to sign in
      </a>
    </div>
  </form>
</main>
<div th:replace="~{fragments/layout :: publicFooter}"></div>
<script>
  (function () {
    document.querySelectorAll('a.transition-link').forEach(function (a) {
      a.addEventListener('click', function (e) {
        var href = this.getAttribute('href') || '';
        if (href.indexOf('/auth/login') >= 0 || href.indexOf('/auth/register') >= 0) {
          e.preventDefault();
          document.body.classList.add('opacity-0', 'transition', 'duration-200');
          setTimeout(function () { window.location.href = href; }, 180);
        }
      });
    });
  })();
</script>
</body>
</html>
