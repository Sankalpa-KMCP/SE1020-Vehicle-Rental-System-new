<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
</head>
<body>
<div th:replace="~{layout :: navbar}"></div>
<main class="container">
    <h1>Login</h1>
    <p class="lead" th:if="${error}" th:text="${error}">Error</p>
    <p class="lead" th:if="${message}" th:text="${message}">Message</p>
    <p class="lead" th:if="${success}" th:text="${success}">Success</p>
    <form class="form-grid" method="post" th:action="@{/auth/login}">
        <label>Username <input type="text" name="username" required autocomplete="username"/></label>
        <label>Password <input type="password" name="password" required autocomplete="current-password"/></label>
        <button class="btn btn-primary" type="submit">Sign in</button>
        <a class="btn btn-ghost" th:href="@{/auth/register}">Create account</a>
    </form>
</main>
</body>
</html>
