<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="welcomeOverlay">
<div id="welcome-overlay" aria-hidden="true">
    <div class="da-welcome__backdrop" aria-hidden="true"></div>
    <div class="da-welcome__panel glass" role="dialog" aria-modal="true"
         th:attr="aria-labelledby=${!#strings.isEmpty(displayName)} ? 'welcome-title' : 'welcome-title-guest'">
        <p class="da-welcome__eyebrow">DriveAway</p>
        <h2 id="welcome-title" class="da-welcome__title welcome-text" th:if="${!#strings.isEmpty(displayName)}">
            Welcome back, <span th:text="${displayName}">Guest</span>.
        </h2>
        <h2 id="welcome-title-guest" class="da-welcome__title welcome-text" th:unless="${!#strings.isEmpty(displayName)}">
            Welcome.
        </h2>
        <p class="da-welcome__lede">Preparing your experience&hellip;</p>
        <div class="da-welcome__actions">
            <button type="button" id="close-welcome-btn" class="da-btn da-btn--primary">Continue</button>
            <a href="#fleet" class="da-welcome__secondary">Explore the fleet</a>
        </div>
    </div>
</div>
</th:block>
</body>
</html>
