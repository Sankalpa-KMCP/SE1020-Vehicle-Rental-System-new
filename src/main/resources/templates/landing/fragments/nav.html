<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="landingNav">
<header>
    <nav id="nav" class="nav" aria-label="Main navigation">
        <div id="nav-progress" class="nav__progress" aria-hidden="true"></div>
        <div class="container nav__inner">
            <a th:href="@{/}" class="nav__brand" aria-label="DriveAway home">DriveAway</a>

            <ul class="nav__links">
                <li><a th:href="@{/features}"
                       th:classappend="${activeNav == 'features'} ? 'is-active' : ''">Why DriveAway</a></li>
                <li><a th:href="@{/how-it-works}"
                       th:classappend="${activeNav == 'how-it-works'} ? 'is-active' : ''">How it works</a></li>
                <li><a th:href="@{/fleet}"
                       th:classappend="${activeNav == 'fleet'} ? 'is-active' : ''">Fleet</a></li>
                <li><a th:href="@{/testimonials}"
                       th:classappend="${activeNav == 'testimonials'} ? 'is-active' : ''">Reviews</a></li>
            </ul>

            <div class="nav__actions">
                <a th:if="${#strings.isEmpty(userRole)}"
                   th:href="@{/auth/login}"
                   class="nav__signin">Sign in</a>
                <a th:if="${!#strings.isEmpty(userRole)}"
                   th:href="@{/dashboard}"
                   class="nav__signin"
                   th:text="${!#strings.isEmpty(displayName) ? displayName : 'Dashboard'}">Dashboard</a>

                <a th:if="${#strings.isEmpty(userRole)}"
                   th:href="@{/auth/register}"
                   class="btn btn--primary nav__cta">Book now</a>
                <a th:if="${!#strings.isEmpty(userRole)}"
                   th:href="@{/customer/fleet}"
                   class="btn btn--primary nav__cta">Browse fleet</a>

                <button type="button" id="nav-toggle" class="nav__toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-mobile">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>

        <div id="nav-mobile" class="nav__mobile" role="dialog" aria-label="Mobile menu">
            <a th:href="@{/features}"
               th:classappend="${activeNav == 'features'} ? 'is-active' : ''">Why DriveAway</a>
            <a th:href="@{/how-it-works}"
               th:classappend="${activeNav == 'how-it-works'} ? 'is-active' : ''">How it works</a>
            <a th:href="@{/fleet}"
               th:classappend="${activeNav == 'fleet'} ? 'is-active' : ''">Fleet</a>
            <a th:href="@{/testimonials}"
               th:classappend="${activeNav == 'testimonials'} ? 'is-active' : ''">Reviews</a>
            <a th:if="${#strings.isEmpty(userRole)}" th:href="@{/auth/login}">Sign in</a>
            <a th:if="${#strings.isEmpty(userRole)}" th:href="@{/auth/register}" class="btn btn--primary">Book now</a>
        </div>
    </nav>
</header>
</th:block>
</body>
</html>
