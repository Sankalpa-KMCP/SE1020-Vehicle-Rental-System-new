<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="indexNav">
<nav id="navbar" class="da-nav" aria-label="Main navigation">
    <div class="da-container da-container--wide da-nav__inner">
        <a th:href="@{/}" class="da-nav__brand transition-link" aria-label="DriveAway home">
            <span class="da-nav__mark" aria-hidden="true">D</span>
            <span>DriveAway</span>
        </a>

        <div class="da-nav__links" role="navigation">
            <a href="#fleet" data-section-link="fleet" class="da-nav__link">Fleet</a>
            <a href="#how-it-works" data-section-link="how-it-works" class="da-nav__link">How it works</a>
            <a href="#team" data-section-link="team" class="da-nav__link">Team</a>
            <a th:href="@{/public/about}" class="da-nav__link transition-link">About</a>
            <a th:href="@{/public/contact}" class="da-nav__link transition-link">Contact</a>
        </div>

        <div class="da-nav__actions" th:if="${#strings.isEmpty(userRole)}">
            <a th:href="@{/auth/login}" class="da-btn da-btn--ghost transition-link">Sign in</a>
            <a th:href="@{/auth/register}" class="da-btn da-btn--primary transition-link">
                Get started
                <span class="da-btn__arrow" aria-hidden="true">&rarr;</span>
            </a>
        </div>

        <div class="da-nav__actions" th:if="${!#strings.isEmpty(userRole)}">
            <span class="da-nav__user">
                <span class="da-tag__dot" aria-hidden="true"></span>
                <span class="da-nav__user-name" th:text="${displayName}">User</span>
            </span>
            <a th:if="${userRole == 'customer'}" th:href="@{/customer/home}" class="da-btn da-btn--primary transition-link">
                Dashboard
                <span class="da-btn__arrow" aria-hidden="true">&rarr;</span>
            </a>
            <a th:if="${userRole == 'staff'}" th:href="@{/dashboard}" class="da-btn da-btn--primary transition-link">
                Staff portal
                <span class="da-btn__arrow" aria-hidden="true">&rarr;</span>
            </a>
        </div>

        <button id="mobile-menu-btn" type="button" class="da-nav__menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
            <i class="ph ph-list" aria-hidden="true"></i>
        </button>
    </div>

    <div id="mobile-menu" class="da-nav__mobile da-container da-container--wide" hidden>
        <a href="#fleet">Fleet</a>
        <a href="#how-it-works">How it works</a>
        <a href="#team">Team</a>
        <a th:href="@{/public/about}" class="transition-link">About</a>
        <a th:href="@{/public/contact}" class="transition-link">Contact</a>
        <th:block th:if="${#strings.isEmpty(userRole)}">
            <a th:href="@{/auth/login}" class="transition-link">Sign in</a>
            <a th:href="@{/auth/register}" class="da-btn da-btn--primary da-btn--block transition-link">Get started</a>
        </th:block>
        <th:block th:if="${!#strings.isEmpty(userRole)}">
            <a th:if="${userRole == 'customer'}" th:href="@{/customer/home}" class="da-btn da-btn--primary da-btn--block transition-link">Dashboard</a>
            <a th:if="${userRole == 'staff'}" th:href="@{/dashboard}" class="da-btn da-btn--primary da-btn--block transition-link">Staff portal</a>
        </th:block>
    </div>
</nav>
</th:block>
</body>
</html>
