<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
    Vehicle-themed inline-SVG mascot system.

    Usage:
        <th:block th:replace="~{landing/fragments/mascots/mascot-svg :: mascot('car-sport')}"></th:block>

    Kinds:
        Cars        car-sport, car-sedan, car-suv, car-electric, car-classic, car-convertible
        Vehicles    bike, van, truck
        Signals     availability, clock, drivers, discover
        Misc       search, key, steering

    Visual language:
        - 64x64 viewBox
        - All mascots are vehicle-themed silhouettes
        - pathLength="100" on draw shapes for stroke-draw reveal
        - Wheels and vehicle bodies with smooth curves
-->
<svg th:fragment="mascot(kind)"
     xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     class="da-mascot"
     th:classappend="${'da-mascot--' + kind}"
     th:attr="data-mascot-kind=${kind}"
     focusable="false"
     aria-hidden="true">

    <!-- Fill layer -->
    <g class="da-mascot__fill" th:switch="${kind}">

        <!-- Sporty coupe -->
        <g th:case="'car-sport'">
            <path d="M8 38 Q12 28 24 26 L48 28 Q56 30 58 38 L58 42 L6 42 Z"/>
            <path d="M18 26 L22 22 L38 22 L42 26 Z"/>
        </g>

        <!-- Sedan -->
        <g th:case="'car-sedan'">
            <path d="M6 40 L10 30 Q12 24 20 24 L40 24 L50 30 L58 34 L58 42 L6 42 Z"/>
            <path d="M16 24 L20 20 L38 20 L44 24 Z"/>
        </g>

        <!-- SUV -->
        <g th:case="'car-suv'">
            <path d="M6 44 L10 24 Q12 18 20 18 L44 18 L50 24 L58 30 L58 44 Z"/>
            <rect x="14" y="18" width="30" height="10" rx="2"/>
        </g>

        <!-- Electric -->
        <g th:case="'car-electric'">
            <path d="M8 40 L12 32 Q14 26 22 26 L42 26 L52 30 L58 34 L58 42 L8 42 Z"/>
            <path d="M22 26 L28 22 L36 22 L42 26 Z"/>
            <path d="M50 8 L44 22 L48 22 L52 12 Z"/>
        </g>

        <!-- Classic car -->
        <g th:case="'car-classic'">
            <path d="M6 40 L10 32 Q10 26 18 26 L32 26 Q38 26 40 32 L56 36 L58 40 L58 44 L6 44 Z"/>
            <path d="M14 26 L16 22 L26 22 Q28 22 30 26 Z"/>
        </g>

        <!-- Convertible -->
        <g th:case="'car-convertible'">
            <path d="M6 42 L10 38 Q14 34 24 34 L46 34 Q54 36 58 40 L58 44 L6 44 Z"/>
            <path d="M12 34 Q14 30 18 30 L28 30 Q30 30 32 34 Z"/>
        </g>

        <!-- Motorcycle -->
        <g th:case="'bike'">
            <ellipse cx="16" cy="44" rx="10" ry="10"/>
            <ellipse cx="48" cy="44" rx="10" ry="10"/>
            <path d="M16 34 L28 22 L40 22 L48 34"/>
            <path d="M28 22 L36 18 L42 20"/>
        </g>

        <!-- Van -->
        <g th:case="'van'">
            <path d="M6 46 L10 20 Q12 16 18 16 L46 16 L52 22 L58 28 L58 46 Z"/>
            <rect x="16" y="20" width="14" height="12" rx="1"/>
            <rect x="32" y="20" width="14" height="12" rx="1"/>
        </g>

        <!-- Truck -->
        <g th:case="'truck'">
            <path d="M6 46 L10 24 Q12 18 18 18 L42 18 L48 24 L58 28 L58 46 Z"/>
            <rect x="44" y="24" width="12" height="14" rx="1"/>
            <rect x="14" y="18" width="20" height="8" rx="1"/>
        </g>

        <!-- signals / misc — no fill layer -->
    </g>

    <!-- Ink outline -->
    <g class="da-mascot__draw" th:switch="${kind}">

        <!-- ============================== CARS ============================== -->

        <g th:case="'car-sport'">
            <!-- Body -->
            <path pathLength="100" d="M8 38 Q12 28 24 26 L48 28 Q56 30 58 38"/>
            <path pathLength="100" d="M6 42 L58 42"/>
            <!-- Roof/windshield -->
            <path pathLength="100" d="M18 26 L22 22 L38 22 L42 26"/>
            <!-- Hood line -->
            <path pathLength="100" d="M8 38 L42 26"/>
            <!-- Wheels -->
            <circle pathLength="100" cx="18" cy="44" r="6"/>
            <circle pathLength="100" cx="46" cy="44" r="6"/>
            <!-- Wheel hubs -->
            <circle pathLength="100" cx="18" cy="44" r="2.5"/>
            <circle pathLength="100" cx="46" cy="44" r="2.5"/>
            <!-- Headlights -->
            <circle pathLength="100" cx="54" cy="36" r="2"/>
            <circle pathLength="100" cx="10" cy="36" r="2"/>
        </g>

        <g th:case="'car-sedan'">
            <!-- Body -->
            <path pathLength="100" d="M6 40 L10 30 Q12 24 20 24 L40 24 L50 30 L58 34"/>
            <path pathLength="100" d="M6 42 L58 42"/>
            <!-- Roof -->
            <path pathLength="100" d="M16 24 L20 20 L38 20 L44 24"/>
            <!-- Wheels -->
            <circle pathLength="100" cx="18" cy="44" r="6"/>
            <circle pathLength="100" cx="48" cy="44" r="6"/>
            <circle pathLength="100" cx="18" cy="44" r="2.5"/>
            <circle pathLength="100" cx="48" cy="44" r="2.5"/>
            <!-- Lights -->
            <circle pathLength="100" cx="54" cy="38" r="2"/>
            <circle pathLength="100" cx="10" cy="38" r="2"/>
        </g>

        <g th:case="'car-suv'">
            <!-- Body -->
            <path pathLength="100" d="M6 44 L10 24 Q12 18 20 18 L44 18 L50 24 L58 30"/>
            <path pathLength="100" d="M6 46 L58 46"/>
            <!-- Windows -->
            <rect pathLength="100" x="14" y="20" width="30" height="10" rx="2"/>
            <!-- Wheel wells -->
            <circle pathLength="100" cx="18" cy="48" r="6"/>
            <circle pathLength="100" cx="48" cy="48" r="6"/>
            <circle pathLength="100" cx="18" cy="48" r="3"/>
            <circle pathLength="100" cx="48" cy="48" r="3"/>
            <!-- Roof rack -->
            <line pathLength="100" x1="18" y1="16" x2="46" y2="16"/>
            <!-- Lights -->
            <circle pathLength="100" cx="54" cy="38" r="2.5"/>
            <circle pathLength="100" cx="10" cy="40" r="2.5"/>
        </g>

        <g th:case="'car-electric'">
            <!-- Body -->
            <path pathLength="100" d="M8 40 L12 32 Q14 26 22 26 L42 26 L52 30 L58 34"/>
            <path pathLength="100" d="M8 42 L58 42"/>
            <!-- Roof -->
            <path pathLength="100" d="M22 26 L28 22 L36 22 L42 26"/>
            <!-- Electric bolt -->
            <path pathLength="100" d="M50 8 L44 22 L48 22 L52 12"/>
            <!-- Wheels -->
            <circle pathLength="100" cx="18" cy="44" r="6"/>
            <circle pathLength="100" cx="48" cy="44" r="6"/>
            <circle pathLength="100" cx="18" cy="44" r="2.5"/>
            <circle pathLength="100" cx="48" cy="44" r="2.5"/>
            <!-- Charge port -->
            <circle pathLength="100" cx="8" cy="36" r="2"/>
        </g>

        <g th:case="'car-classic'">
            <!-- Body -->
            <path pathLength="100" d="M6 40 L10 32 Q10 26 18 26 L32 26 Q38 26 40 32 L56 36 L58 40"/>
            <path pathLength="100" d="M6 44 L58 44"/>
            <!-- Hood -->
            <path pathLength="100" d="M14 26 L16 22 L26 22 Q28 22 30 26"/>
            <!-- Chrome bumpers -->
            <path pathLength="100" d="M6 38 L6 44"/>
            <path pathLength="100" d="M58 38 L58 44"/>
            <!-- Wheels -->
            <circle pathLength="100" cx="16" cy="44" r="6"/>
            <circle pathLength="100" cx="50" cy="44" r="6"/>
            <circle pathLength="100" cx="16" cy="44" r="3"/>
            <circle pathLength="100" cx="50" cy="44" r="3"/>
        </g>

        <g th:case="'car-convertible'">
            <!-- Body -->
            <path pathLength="100" d="M6 42 L10 38 Q14 34 24 34 L46 34 Q54 36 58 40"/>
            <path pathLength="100" d="M6 44 L58 44"/>
            <!-- Soft top (folded) -->
            <path pathLength="100" d="M12 34 Q14 30 18 30 L28 30 Q30 30 32 34"/>
            <!-- Wheels -->
            <circle pathLength="100" cx="18" cy="46" r="6"/>
            <circle pathLength="100" cx="48" cy="46" r="6"/>
            <circle pathLength="100" cx="18" cy="46" r="2.5"/>
            <circle pathLength="100" cx="48" cy="46" r="2.5"/>
        </g>

        <!-- ============================== OTHER VEHICLES ============================== -->

        <g th:case="'bike'">
            <!-- Wheels -->
            <circle pathLength="100" cx="16" cy="44" r="10"/>
            <circle pathLength="100" cx="48" cy="44" r="10"/>
            <!-- Frame -->
            <path pathLength="100" d="M16 34 L28 22 L40 22 L48 34"/>
            <path pathLength="100" d="M28 22 L36 18 L42 20"/>
            <path pathLength="100" d="M16 34 L28 34 L48 34"/>
            <!-- Handlebars -->
            <line pathLength="100" x1="36" y1="18" x2="42" y2="14"/>
            <line pathLength="100" x1="42" y1="14" x2="46" y2="14"/>
            <!-- Seat -->
            <ellipse pathLength="100" cx="24" cy="28" rx="6" ry="2"/>
        </g>

        <g th:case="'van'">
            <!-- Body -->
            <path pathLength="100" d="M6 46 L10 20 Q12 16 18 16 L46 16 L52 22 L58 28"/>
            <path pathLength="100" d="M6 48 L58 48"/>
            <!-- Windows -->
            <rect pathLength="100" x="16" y="20" width="14" height="12" rx="1"/>
            <rect pathLength="100" x="32" y="20" width="14" height="12" rx="1"/>
            <!-- Wheels -->
            <circle pathLength="100" cx="16" cy="50" r="6"/>
            <circle pathLength="100" cx="50" cy="50" r="6"/>
            <circle pathLength="100" cx="16" cy="50" r="3"/>
            <circle pathLength="100" cx="50" cy="50" r="3"/>
        </g>

        <g th:case="'truck'">
            <!-- Cargo -->
            <path pathLength="100" d="M6 46 L10 24 Q12 18 18 18 L42 18 L48 24"/>
            <path pathLength="100" d="M6 48 L48 48"/>
            <!-- Cabin -->
            <rect pathLength="100" x="44" y="24" width="12" height="14" rx="1"/>
            <!-- Hood -->
            <rect pathLength="100" x="14" y="18" width="20" height="8" rx="1"/>
            <!-- Wheels -->
            <circle pathLength="100" cx="18" cy="50" r="6"/>
            <circle pathLength="100" cx="42" cy="50" r="6"/>
            <circle pathLength="100" cx="18" cy="50" r="3"/>
            <circle pathLength="100" cx="42" cy="50" r="3"/>
            <!-- Bumper -->
            <line pathLength="100" x1="54" y1="38" x2="58" y2="38"/>
        </g>

        <!-- ============================== SIGNALS ============================== -->

        <g th:case="'availability'">
            <circle pathLength="100" cx="32" cy="32" r="4"/>
            <circle pathLength="100" cx="32" cy="32" r="10" opacity="0.55"/>
            <circle pathLength="100" cx="32" cy="32" r="16" opacity="0.25"/>
        </g>

        <g th:case="'clock'">
            <circle pathLength="100" cx="32" cy="32" r="18"/>
            <line pathLength="100" x1="32" y1="32" x2="32" y2="20"/>
            <line pathLength="100" x1="32" y1="32" x2="42" y2="36"/>
            <circle pathLength="100" cx="32" cy="32" r="1.6"/>
        </g>

        <g th:case="'drivers'">
            <circle pathLength="100" cx="30" cy="18" r="5"/>
            <path pathLength="100" d="M26 26 L22 40 L24 52"/>
            <path pathLength="100" d="M28 26 L36 26 L40 40 L38 52"/>
            <path pathLength="100" d="M36 30 L46 26"/>
            <line pathLength="100" x1="14" y1="56" x2="22" y2="56" opacity="0.55"/>
            <line pathLength="100" x1="12" y1="50" x2="18" y2="50" opacity="0.35"/>
        </g>

        <g th:case="'discover'">
            <line pathLength="100" x1="20" y1="20" x2="44" y2="44"/>
            <path pathLength="100" d="M36 44 L44 44 L44 36"/>
            <circle pathLength="100" cx="18" cy="40" r="1.5"/>
            <circle pathLength="100" cx="46" cy="22" r="1.5"/>
            <circle pathLength="100" cx="30" cy="14" r="1" opacity="0.6"/>
        </g>

        <!-- ============================== MISC ============================== -->

        <g th:case="'search'">
            <circle pathLength="100" cx="26" cy="26" r="14"/>
            <line pathLength="100" x1="38" y1="38" x2="50" y2="50"/>
        </g>

        <g th:case="'key'">
            <circle pathLength="100" cx="20" cy="20" r="12"/>
            <circle pathLength="100" cx="20" cy="20" r="6"/>
            <line pathLength="100" x1="30" y1="30" x2="54" y2="54"/>
            <line pathLength="100" x1="46" y1="46" x2="46" y2="54"/>
            <line pathLength="100" x1="50" y1="50" x2="50" y2="58"/>
        </g>

        <g th:case="'steering'">
            <circle pathLength="100" cx="32" cy="32" r="18"/>
            <circle pathLength="100" cx="32" cy="32" r="6"/>
            <line pathLength="100" x1="32" y1="14" x2="32" y2="26"/>
            <line pathLength="100" x1="17" y1="40" x2="27" y2="32"/>
            <line pathLength="100" x1="47" y1="40" x2="37" y2="32"/>
        </g>

    </g>

</svg>
</body>
</html>
