<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
    Unified inline-SVG mascot system.

    Usage:
        <th:block th:replace="~{landing/fragments/mascots/mascot-svg :: mascot('founder')}"></th:block>

    Kinds:
        Team       founder, senior-dev, ops, cx, tech-director, marketing
        Signals    availability, clock, drivers, discover
        Cars       car-economy, car-sedan, car-suv, car-van, car-offroad, car-electric
        Misc       search

    Visual language:
        - 64x64 viewBox
        - Team characters use da-mascot__fill (soft silhouette) + da-mascot__draw (ink outline)
        - pathLength="100" on draw shapes for stroke-draw reveal
        - .da-mascot__eye circles for cursor tracking
-->
<svg th:fragment="mascot(kind)"
     xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     class="da-mascot"
     th:classappend="${'da-mascot--' + kind}"
     th:attr="data-mascot-kind=${kind}"
     focusable="false"
     aria-hidden="true">

    <!-- Soft silhouette — always visible, no stroke-draw -->
    <g class="da-mascot__fill" th:switch="${kind}">

        <g th:case="'founder'">
            <ellipse cx="32" cy="23" rx="12" ry="13"/>
            <path d="M16 58 Q16 44 32 40 Q48 44 48 58 Z"/>
        </g>

        <g th:case="'senior-dev'">
            <ellipse cx="32" cy="23" rx="12" ry="13"/>
            <path d="M14 58 Q14 44 32 40 Q50 44 50 58 Z"/>
        </g>

        <g th:case="'ops'">
            <ellipse cx="32" cy="24" rx="12" ry="13"/>
            <path d="M14 58 Q14 42 32 39 Q50 42 50 58 Z"/>
            <path d="M26 10 Q32 4 38 10 Q36 16 32 17 Q28 16 26 10 Z"/>
        </g>

        <g th:case="'cx'">
            <path d="M16 28 Q16 10 32 10 Q48 10 48 28 L48 44 Q48 52 32 52 Q16 52 16 44 Z"/>
            <ellipse cx="32" cy="26" rx="9" ry="10"/>
            <path d="M12 58 Q12 46 24 44 L40 44 Q52 46 52 58 Z"/>
        </g>

        <g th:case="'tech-director'">
            <rect x="20" y="13" width="24" height="24" rx="7"/>
            <path d="M12 58 L15 44 L24 38 L40 38 L49 44 L52 58 Z"/>
        </g>

        <g th:case="'marketing'">
            <ellipse cx="32" cy="24" rx="12" ry="13"/>
            <path d="M14 58 Q14 42 32 39 Q50 42 50 58 Z"/>
            <path d="M20 8 L24 2 L28 8 L32 2 L36 8 L40 2 L40 12 L24 12 Z"/>
        </g>

        <!-- signals / cars / search — no fill layer -->
    </g>

    <!-- Ink outline — stroke-draw reveal -->
    <g class="da-mascot__draw" th:switch="${kind}">

        <!-- ============================== TEAM ============================== -->

        <g th:case="'founder'">
            <circle pathLength="100" cx="32" cy="23" r="12"/>
            <path   pathLength="100" d="M22 14 Q32 8 42 14"/>
            <path   pathLength="100" d="M14 58 Q14 44 32 40 Q50 44 50 58"/>
            <path   pathLength="100" d="M28 40 L32 52 L36 40"/>
            <path   pathLength="100" d="M26 40 L38 40"/>
            <path   pathLength="100" d="M24 38 L28 34 L36 34 L40 38"/>
        </g>

        <g th:case="'senior-dev'">
            <circle pathLength="100" cx="32" cy="23" r="12"/>
            <rect   pathLength="100" x="21" y="19" width="9" height="7" rx="1.5"/>
            <rect   pathLength="100" x="34" y="19" width="9" height="7" rx="1.5"/>
            <line   pathLength="100" x1="30" y1="22.5" x2="34" y2="22.5"/>
            <path   pathLength="100" d="M14 58 Q14 44 32 40 Q50 44 50 58"/>
            <path   pathLength="100" d="M22 36 Q32 32 42 36"/>
            <rect   pathLength="100" x="24" y="48" width="16" height="8" rx="1.5"/>
            <line   pathLength="100" x1="27" y1="51" x2="37" y2="51"/>
            <line   pathLength="100" x1="27" y1="54" x2="33" y2="54"/>
        </g>

        <g th:case="'ops'">
            <circle pathLength="100" cx="32" cy="24" r="12"/>
            <path   pathLength="100" d="M26 10 Q32 4 38 10 Q36 16 32 17 Q28 16 26 10 Z"/>
            <path   pathLength="100" d="M14 58 Q14 42 32 39 Q50 42 50 58"/>
            <path   pathLength="100" d="M26 30 Q32 34 38 30"/>
            <path   pathLength="100" d="M22 36 L26 40 L38 40 L42 36"/>
        </g>

        <g th:case="'cx'">
            <path   pathLength="100" d="M16 28 Q16 10 32 10 Q48 10 48 28 L48 44 Q48 52 32 52 Q16 52 16 44 Z"/>
            <ellipse pathLength="100" cx="32" cy="26" rx="9" ry="10"/>
            <path   pathLength="100" d="M12 58 Q12 46 24 44 L40 44 Q52 46 52 58"/>
            <path   pathLength="100" d="M28 30 Q32 33 36 30"/>
        </g>

        <g th:case="'tech-director'">
            <rect   pathLength="100" x="20" y="13" width="24" height="24" rx="7"/>
            <rect   pathLength="100" x="23" y="19" width="7" height="5" rx="1"/>
            <rect   pathLength="100" x="34" y="19" width="7" height="5" rx="1"/>
            <line   pathLength="100" x1="30" y1="21.5" x2="34" y2="21.5"/>
            <path   pathLength="100" d="M12 58 L15 44 L24 38 L40 38 L49 44 L52 58"/>
            <line   pathLength="100" x1="24" y1="38" x2="40" y2="38"/>
            <line   pathLength="100" x1="32" y1="38" x2="32" y2="44"/>
            <path   pathLength="100" d="M28 44 L32 48 L36 44"/>
        </g>

        <g th:case="'marketing'">
            <path   pathLength="100" d="M20 8 L24 2 L28 8 L32 2 L36 8 L40 2 L40 12 L24 12 Z"/>
            <circle pathLength="100" cx="32" cy="24" r="12"/>
            <path   pathLength="100" d="M14 58 Q14 42 32 39 Q50 42 50 58"/>
            <path   pathLength="100" d="M46 34 L58 30 L58 38 L46 42 Z"/>
            <line   pathLength="100" x1="46" y1="38" x2="52" y2="36"/>
            <path   pathLength="100" d="M26 30 Q32 34 38 30"/>
        </g>

        <!-- ============================== SIGNALS ============================ -->

        <g th:case="'availability'">
            <circle pathLength="100" cx="32" cy="32" r="4"/>
            <circle pathLength="100" cx="32" cy="32" r="10" opacity="0.55"/>
            <circle pathLength="100" cx="32" cy="32" r="16" opacity="0.25"/>
        </g>

        <g th:case="'clock'">
            <circle pathLength="100" cx="32" cy="32" r="18"/>
            <line   pathLength="100" x1="32" y1="32" x2="32" y2="20"/>
            <line   pathLength="100" x1="32" y1="32" x2="42" y2="36"/>
            <circle pathLength="100" cx="32" cy="32" r="1.6"/>
        </g>

        <g th:case="'drivers'">
            <circle pathLength="100" cx="30" cy="18" r="5"/>
            <path   pathLength="100" d="M26 26 L22 40 L24 52"/>
            <path   pathLength="100" d="M28 26 L36 26 L40 40 L38 52"/>
            <path   pathLength="100" d="M36 30 L46 26"/>
            <line   pathLength="100" x1="14" y1="56" x2="22" y2="56" opacity="0.55"/>
            <line   pathLength="100" x1="12" y1="50" x2="18" y2="50" opacity="0.35"/>
        </g>

        <g th:case="'discover'">
            <line   pathLength="100" x1="20" y1="20" x2="44" y2="44"/>
            <path   pathLength="100" d="M36 44 L44 44 L44 36"/>
            <circle pathLength="100" cx="18" cy="40" r="1.5"/>
            <circle pathLength="100" cx="46" cy="22" r="1.5"/>
            <circle pathLength="100" cx="30" cy="14" r="1" opacity="0.6"/>
        </g>

        <!-- ============================== CARS ============================== -->

        <g th:case="'car-economy'">
            <path   pathLength="100" d="M10 42 L14 32 Q16 26 22 26 L40 26 L46 32 L54 32 L54 42 Z"/>
            <line   pathLength="100" x1="20" y1="26" x2="38" y2="26"/>
            <circle pathLength="100" cx="20" cy="44" r="4"/>
            <circle pathLength="100" cx="44" cy="44" r="4"/>
        </g>

        <g th:case="'car-sedan'">
            <path   pathLength="100" d="M6 42 L12 32 Q14 26 20 26 L40 22 L50 28 L58 30 L58 42 Z"/>
            <line   pathLength="100" x1="22" y1="26" x2="40" y2="22"/>
            <circle pathLength="100" cx="18" cy="44" r="4"/>
            <circle pathLength="100" cx="48" cy="44" r="4"/>
        </g>

        <g th:case="'car-suv'">
            <path   pathLength="100" d="M6 44 L10 26 Q12 20 18 20 L46 20 L52 26 L58 30 L58 44 Z"/>
            <line   pathLength="100" x1="18" y1="20" x2="46" y2="20"/>
            <circle pathLength="100" cx="18" cy="46" r="4.5"/>
            <circle pathLength="100" cx="48" cy="46" r="4.5"/>
        </g>

        <g th:case="'car-van'">
            <path   pathLength="100" d="M6 44 L10 22 Q12 18 16 18 L48 18 L52 22 L58 26 L58 44 Z"/>
            <rect   pathLength="100" x="18" y="22" width="14" height="10"/>
            <rect   pathLength="100" x="34" y="22" width="14" height="10"/>
            <circle pathLength="100" cx="18" cy="46" r="4"/>
            <circle pathLength="100" cx="48" cy="46" r="4"/>
        </g>

        <g th:case="'car-offroad'">
            <path   pathLength="100" d="M6 40 L10 24 Q12 18 18 18 L46 18 L52 24 L58 28 L58 40 Z"/>
            <line   pathLength="100" x1="14" y1="18" x2="50" y2="18"/>
            <line   pathLength="100" x1="14" y1="14" x2="50" y2="14"/>
            <circle pathLength="100" cx="18" cy="44" r="6"/>
            <circle pathLength="100" cx="48" cy="44" r="6"/>
        </g>

        <g th:case="'car-electric'">
            <path   pathLength="100" d="M6 42 L12 32 Q14 26 20 26 L40 22 L50 28 L58 30 L58 42 Z"/>
            <line   pathLength="100" x1="22" y1="26" x2="40" y2="22"/>
            <circle pathLength="100" cx="18" cy="44" r="4"/>
            <circle pathLength="100" cx="48" cy="44" r="4"/>
            <path   pathLength="100" d="M34 6 L28 18 L33 18 L30 28"/>
        </g>

        <!-- ============================== MISC ============================== -->

        <g th:case="'search'">
            <circle pathLength="100" cx="26" cy="26" r="14"/>
            <line   pathLength="100" x1="38" y1="38" x2="50" y2="50"/>
        </g>

    </g>

    <!-- Accent highlights (tie, crown gems, laptop glow) -->
    <g class="da-mascot__accent" th:switch="${kind}">
        <line th:case="'founder'"     pathLength="100" x1="32" y1="40" x2="32" y2="52"/>
        <line th:case="'senior-dev'"  pathLength="100" x1="28" y1="51" x2="36" y2="51"/>
        <g th:case="'marketing'">
            <circle cx="32" cy="6" r="1.2"/>
            <circle cx="28" cy="8" r="0.8"/>
            <circle cx="36" cy="8" r="0.8"/>
        </g>
    </g>

    <!-- Eyes + expressions -->
    <g class="da-mascot__face" th:switch="${kind}">

        <g th:case="'founder'">
            <circle class="da-mascot__eye da-mascot__eye--left"  cx="27" cy="23" r="2"/>
            <circle class="da-mascot__eye da-mascot__eye--right" cx="37" cy="23" r="2"/>
        </g>

        <g th:case="'senior-dev'">
            <circle class="da-mascot__eye da-mascot__eye--left"  cx="25.5" cy="22.5" r="1.6"/>
            <circle class="da-mascot__eye da-mascot__eye--right" cx="38.5" cy="22.5" r="1.6"/>
        </g>

        <g th:case="'ops'">
            <circle class="da-mascot__eye da-mascot__eye--left"  cx="27" cy="24" r="2"/>
            <circle class="da-mascot__eye da-mascot__eye--right" cx="37" cy="24" r="2"/>
        </g>

        <g th:case="'cx'">
            <circle class="da-mascot__eye da-mascot__eye--left"  cx="28" cy="26" r="1.8"/>
            <circle class="da-mascot__eye da-mascot__eye--right" cx="36" cy="26" r="1.8"/>
        </g>

        <g th:case="'tech-director'">
            <circle class="da-mascot__eye da-mascot__eye--left"  cx="26.5" cy="21.5" r="1.5"/>
            <circle class="da-mascot__eye da-mascot__eye--right" cx="37.5" cy="21.5" r="1.5"/>
        </g>

        <g th:case="'marketing'">
            <circle class="da-mascot__eye da-mascot__eye--left"  cx="27" cy="24" r="2"/>
            <circle class="da-mascot__eye da-mascot__eye--right" cx="37" cy="24" r="2"/>
        </g>

    </g>

</svg>
</body>
</html>
