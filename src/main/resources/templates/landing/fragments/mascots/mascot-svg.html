<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
    Unified inline-SVG mascot system.

    Usage:
        <th:block th:replace="~{landing/fragments/mascots/mascot-svg :: mascot('founder')}"></th:block>

    Kinds:
        Team       founder, senior-dev, ops, cx, tech-director, marketing
        Signals    availability, clock, drivers, discover
        Cars       car-economy, car-sedan, car-suv, car-van, car-offroad, car-electric
        Misc       search

    Visual language:
        - 64x64 viewBox
        - 1.5px shared stroke, rounded caps, no fill
        - pathLength="100" on every shape so JS can draw with normalized dashoffset
        - Two .da-mascot__eye circles per character — JS may translate these for cursor tracking
        - The .da-mascot__draw group is where the stroke-draw reveal lives

    All decorative (aria-hidden="true"); add semantic context in the host element.
-->
<svg th:fragment="mascot(kind)"
     xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     class="da-mascot"
     th:classappend="${'da-mascot--' + kind}"
     th:attr="data-mascot-kind=${kind}"
     focusable="false"
     aria-hidden="true">

    <g class="da-mascot__draw" th:switch="${kind}">

        <!-- ============================== TEAM ============================== -->

        <g th:case="'founder'">
            <circle pathLength="100" cx="32" cy="24" r="11"/>
            <path   pathLength="100" d="M14 58 Q14 42 24 38 L26 34 L38 34 L40 38 Q50 42 50 58"/>
            <path   pathLength="100" d="M28 35 L32 41 L36 35"/>
        </g>

        <g th:case="'senior-dev'">
            <circle pathLength="100" cx="32" cy="24" r="11"/>
            <rect   pathLength="100" x="22.5" y="20" width="8" height="6" rx="1"/>
            <rect   pathLength="100" x="33.5" y="20" width="8" height="6" rx="1"/>
            <line   pathLength="100" x1="30.5" y1="23" x2="33.5" y2="23"/>
            <path   pathLength="100" d="M14 58 Q14 42 32 38 Q50 42 50 58"/>
        </g>

        <g th:case="'ops'">
            <circle pathLength="100" cx="32" cy="24" r="12"/>
            <path   pathLength="100" d="M14 58 Q14 40 32 38 Q50 40 50 58"/>
            <path   pathLength="100" d="M22 18 Q32 10 42 18"/>
        </g>

        <g th:case="'cx'">
            <path   pathLength="100" d="M18 30 Q18 12 32 12 Q46 12 46 30 L46 42 L18 42 Z"/>
            <circle pathLength="100" cx="32" cy="24" r="9"/>
            <path   pathLength="100" d="M12 58 Q12 44 24 42 L40 42 Q52 44 52 58"/>
        </g>

        <g th:case="'tech-director'">
            <rect   pathLength="100" x="20" y="14" width="24" height="22" rx="6"/>
            <line   pathLength="100" x1="25" y1="20" x2="29" y2="20"/>
            <line   pathLength="100" x1="35" y1="20" x2="39" y2="20"/>
            <path   pathLength="100" d="M12 58 L14 44 L22 38 L42 38 L50 44 L52 58"/>
        </g>

        <g th:case="'marketing'">
            <path   pathLength="100" d="M22 14 L26 6 L30 14 L34 6 L38 14 L42 6 L42 16"/>
            <circle pathLength="100" cx="32" cy="24" r="11"/>
            <path   pathLength="100" d="M14 58 Q14 40 32 38 Q50 40 50 58"/>
        </g>

        <!-- ============================== SIGNALS ============================ -->

        <g th:case="'availability'">
            <circle pathLength="100" cx="32" cy="32" r="4"/>
            <circle pathLength="100" cx="32" cy="32" r="10" opacity="0.55"/>
            <circle pathLength="100" cx="32" cy="32" r="16" opacity="0.25"/>
        </g>

        <g th:case="'clock'">
            <circle pathLength="100" cx="32" cy="32" r="18"/>
            <line   pathLength="100" x1="32" y1="32" x2="32" y2="20"/>
            <line   pathLength="100" x1="32" y1="32" x2="42" y2="36"/>
            <circle pathLength="100" cx="32" cy="32" r="1.6"/>
        </g>

        <g th:case="'drivers'">
            <circle pathLength="100" cx="30" cy="18" r="5"/>
            <path   pathLength="100" d="M26 26 L22 40 L24 52"/>
            <path   pathLength="100" d="M28 26 L36 26 L40 40 L38 52"/>
            <path   pathLength="100" d="M36 30 L46 26"/>
            <line   pathLength="100" x1="14" y1="56" x2="22" y2="56" opacity="0.55"/>
            <line   pathLength="100" x1="12" y1="50" x2="18" y2="50" opacity="0.35"/>
        </g>

        <g th:case="'discover'">
            <line   pathLength="100" x1="20" y1="20" x2="44" y2="44"/>
            <path   pathLength="100" d="M36 44 L44 44 L44 36"/>
            <circle pathLength="100" cx="18" cy="40" r="1.5"/>
            <circle pathLength="100" cx="46" cy="22" r="1.5"/>
            <circle pathLength="100" cx="30" cy="14" r="1" opacity="0.6"/>
        </g>

        <!-- ============================== CARS ============================== -->

        <g th:case="'car-economy'">
            <path   pathLength="100" d="M10 42 L14 32 Q16 26 22 26 L40 26 L46 32 L54 32 L54 42 Z"/>
            <line   pathLength="100" x1="20" y1="26" x2="38" y2="26"/>
            <circle pathLength="100" cx="20" cy="44" r="4"/>
            <circle pathLength="100" cx="44" cy="44" r="4"/>
        </g>

        <g th:case="'car-sedan'">
            <path   pathLength="100" d="M6 42 L12 32 Q14 26 20 26 L40 22 L50 28 L58 30 L58 42 Z"/>
            <line   pathLength="100" x1="22" y1="26" x2="40" y2="22"/>
            <circle pathLength="100" cx="18" cy="44" r="4"/>
            <circle pathLength="100" cx="48" cy="44" r="4"/>
        </g>

        <g th:case="'car-suv'">
            <path   pathLength="100" d="M6 44 L10 26 Q12 20 18 20 L46 20 L52 26 L58 30 L58 44 Z"/>
            <line   pathLength="100" x1="18" y1="20" x2="46" y2="20"/>
            <circle pathLength="100" cx="18" cy="46" r="4.5"/>
            <circle pathLength="100" cx="48" cy="46" r="4.5"/>
        </g>

        <g th:case="'car-van'">
            <path   pathLength="100" d="M6 44 L10 22 Q12 18 16 18 L48 18 L52 22 L58 26 L58 44 Z"/>
            <rect   pathLength="100" x="18" y="22" width="14" height="10"/>
            <rect   pathLength="100" x="34" y="22" width="14" height="10"/>
            <circle pathLength="100" cx="18" cy="46" r="4"/>
            <circle pathLength="100" cx="48" cy="46" r="4"/>
        </g>

        <g th:case="'car-offroad'">
            <path   pathLength="100" d="M6 40 L10 24 Q12 18 18 18 L46 18 L52 24 L58 28 L58 40 Z"/>
            <line   pathLength="100" x1="14" y1="18" x2="50" y2="18"/>
            <line   pathLength="100" x1="14" y1="14" x2="50" y2="14"/>
            <circle pathLength="100" cx="18" cy="44" r="6"/>
            <circle pathLength="100" cx="48" cy="44" r="6"/>
        </g>

        <g th:case="'car-electric'">
            <path   pathLength="100" d="M6 42 L12 32 Q14 26 20 26 L40 22 L50 28 L58 30 L58 42 Z"/>
            <line   pathLength="100" x1="22" y1="26" x2="40" y2="22"/>
            <circle pathLength="100" cx="18" cy="44" r="4"/>
            <circle pathLength="100" cx="48" cy="44" r="4"/>
            <path   pathLength="100" d="M34 6 L28 18 L33 18 L30 28"/>
        </g>

        <!-- ============================== MISC ============================== -->

        <g th:case="'search'">
            <circle pathLength="100" cx="26" cy="26" r="14"/>
            <line   pathLength="100" x1="38" y1="38" x2="50" y2="50"/>
        </g>

    </g>

    <!--
        Eyes — separate group so JS can translate them independently
        for cursor tracking. Only present for kinds with a face.
    -->
    <g class="da-mascot__face" th:switch="${kind}">

        <g th:case="'founder'">
            <circle class="da-mascot__eye da-mascot__eye--left"  cx="27" cy="24" r="1.5"/>
            <circle class="da-mascot__eye da-mascot__eye--right" cx="37" cy="24" r="1.5"/>
        </g>

        <g th:case="'senior-dev'">
            <circle class="da-mascot__eye da-mascot__eye--left"  cx="26.5" cy="23" r="1.2"/>
            <circle class="da-mascot__eye da-mascot__eye--right" cx="37.5" cy="23" r="1.2"/>
        </g>

        <g th:case="'ops'">
            <circle class="da-mascot__eye da-mascot__eye--left"  cx="27" cy="24" r="1.5"/>
            <circle class="da-mascot__eye da-mascot__eye--right" cx="37" cy="24" r="1.5"/>
        </g>

        <g th:case="'cx'">
            <circle class="da-mascot__eye da-mascot__eye--left"  cx="28" cy="24" r="1.3"/>
            <circle class="da-mascot__eye da-mascot__eye--right" cx="36" cy="24" r="1.3"/>
        </g>

        <g th:case="'tech-director'">
            <circle class="da-mascot__eye da-mascot__eye--left"  cx="27" cy="25" r="1.4"/>
            <circle class="da-mascot__eye da-mascot__eye--right" cx="37" cy="25" r="1.4"/>
        </g>

        <g th:case="'marketing'">
            <circle class="da-mascot__eye da-mascot__eye--left"  cx="27" cy="24" r="1.5"/>
            <circle class="da-mascot__eye da-mascot__eye--right" cx="37" cy="24" r="1.5"/>
        </g>

    </g>

</svg>
</body>
</html>
