<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="statsSection">
<section class="da-scene da-scene--band" aria-label="Numbers that matter" data-chapter="03" data-chapter-name="Pulse" data-mood="act">
    <div class="da-container da-container--wide">
        <header class="da-band__head da-reveal">
            <span class="da-eyebrow"><span class="da-eyebrow__num">03</span>Numbers</span>
            <p class="da-band__caption">Operating across the island since 2024 &mdash; the data we&rsquo;re proud of.</p>
        </header>
        <ol class="da-band__numbers">
            <li class="da-figure da-reveal">
                <span class="da-figure__num"><span class="counter" data-target="250">0</span><span class="da-figure__plus">+</span></span>
                <span class="da-figure__label">Premium vehicles</span>
            </li>
            <li class="da-figure da-reveal" style="transition-delay:60ms">
                <span class="da-figure__num"><span class="counter" data-target="1200">0</span><span class="da-figure__plus">+</span></span>
                <span class="da-figure__label">Active drivers</span>
            </li>
            <li class="da-figure da-reveal" style="transition-delay:120ms">
                <span class="da-figure__num"><span class="counter" data-target="15">0</span></span>
                <span class="da-figure__label">City hubs</span>
            </li>
            <li class="da-figure da-reveal" style="transition-delay:180ms">
                <span class="da-figure__num"><span class="counter" data-target="4.9">0</span></span>
                <span class="da-figure__label">Average rating</span>
            </li>
        </ol>
    </div>
</section>
</th:block>
</body>
</html>
