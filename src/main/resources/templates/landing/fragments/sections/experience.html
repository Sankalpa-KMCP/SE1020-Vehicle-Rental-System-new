<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="experienceSection">
<section class="da-scene da-scene--inset" aria-label="Mobile experience" data-chapter="12" data-chapter-name="In Hand" data-mood="resolve">
    <div class="da-container da-container--wide">
        <div class="da-inset">
            <div class="da-inset__copy da-reveal" data-parallax="0.04">
                <span class="da-eyebrow"><span class="da-eyebrow__num">12</span>Experience</span>
                <h2 class="da-inset__title">Your keys,<br/><em>in your pocket.</em></h2>
                <p class="da-inset__body">Manage bookings, unlock cars digitally, and contact 24/7 support instantly with the new DriveAway mobile app.</p>
                <div class="da-inset__actions">
                    <button type="button" class="da-btn da-btn--inset">
                        <i class="ph-fill ph-apple-logo" aria-hidden="true"></i> App Store
                    </button>
                    <button type="button" class="da-btn da-btn--inset da-btn--inset-ghost">
                        <i class="ph-fill ph-google-play-logo" aria-hidden="true"></i> Google Play
                    </button>
                </div>
            </div>
            <div class="da-inset__device da-reveal" aria-hidden="true" data-parallax="-0.06">
                <div class="da-device">
                    <div class="da-device__notch"></div>
                    <div class="da-device__screen">
                        <div class="da-device__row">
                            <span class="da-device__time">9:41</span>
                            <span class="da-device__brand">DriveAway</span>
                            <i class="ph ph-dots-three"></i>
                        </div>
                        <div class="da-device__card">
                            <p class="da-device__label">Active booking</p>
                            <p class="da-device__model">Toyota Axio</p>
                            <p class="da-device__meta">Mar 14 &mdash; Mar 18 &middot; Colombo 03</p>
                        </div>
                        <div class="da-device__unlock">
                            <i class="ph-fill ph-lock-key-open" aria-hidden="true"></i>
                            Tap to unlock
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</th:block>
</body>
</html>
