<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DriveAway | Premium Vehicle Rentals</title>
    <meta name="description" content="DriveAway — premium vehicle rentals in Sri Lanka. Browse verified cars, book exact dates, and skip the counter."/>
    <meta name="theme-color" content="#050506"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet"/>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" th:href="@{/landing/css/tokens.css}"/>
    <link rel="stylesheet" th:href="@{/landing/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/landing/css/components.css}"/>
    <link rel="stylesheet" th:href="@{/landing/css/hero.css}"/>
    <link rel="stylesheet" th:href="@{/landing/css/sections.css}"/>
    <link rel="stylesheet" th:href="@{/landing/css/loader.css}"/>
    <link rel="stylesheet" th:href="@{/landing/css/motion.css}"/>
    <link rel="stylesheet" th:href="@{/landing/css/animations.css}"/>
    <link rel="stylesheet" th:href="@{/landing/css/responsive.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="index-landing lux-landing">

<th:block th:replace="~{landing/fragments/overlays/loader :: pageLoader}"></th:block>
<th:block th:replace="~{landing/fragments/overlays/welcome :: welcomeOverlay}"></th:block>

<div class="index-landing-shell">
    <div th:replace="~{landing/fragments/nav :: indexNav}"></div>

    <aside class="da-chapter" id="chapter-marker" aria-hidden="true">
        <span class="da-chapter__num" data-chapter-num>01</span>
        <span class="da-chapter__rule"></span>
        <span class="da-chapter__label" data-chapter-label>Act</span>
    </aside>

    <main class="da-canvas" id="top">
        <th:block th:replace="~{landing/fragments/sections/hero :: heroSection}"></th:block>
        <th:block th:replace="~{landing/fragments/sections/partners :: partnersSection}"></th:block>
        <th:block th:replace="~{landing/fragments/sections/fleet :: fleetSection}"></th:block>
        <th:block th:replace="~{landing/fragments/sections/experience :: experienceSection}"></th:block>
        <th:block th:replace="~{landing/fragments/sections/categories :: categoriesSection}"></th:block>
        <th:block th:replace="~{landing/fragments/sections/advantage :: advantageSection}"></th:block>
        <th:block th:replace="~{landing/fragments/sections/stats :: statsSection}"></th:block>
        <th:block th:replace="~{landing/fragments/sections/locations :: locationsSection}"></th:block>
        <th:block th:replace="~{landing/fragments/sections/team :: teamSection}"></th:block>
        <th:block th:replace="~{landing/fragments/sections/testimonials :: testimonialsSection}"></th:block>
        <th:block th:replace="~{landing/fragments/sections/faq :: faqSection}"></th:block>
        <th:block th:replace="~{landing/fragments/sections/cta :: ctaSection}"></th:block>
    </main>

    <th:block th:replace="~{landing/fragments/sections/floating-actions :: floatingActions}"></th:block>

    <div th:replace="~{landing/fragments/footer :: indexFooter}"></div>
</div>

<script th:src="@{/landing/js/loader.js}"></script>
<script th:src="@{/landing/js/scroll.js}"></script>
<script th:src="@{/landing/js/interactions.js}"></script>
<script th:src="@{/landing/js/motion.js}"></script>
<script th:src="@{/landing/js/mascots.js}"></script>
<script th:src="@{/landing/js/landing-3d.js}"></script>
<script th:src="@{/landing/js/script-3d-engine.js}"></script>
<script>
    // Active navigation link highlighting
    document.addEventListener('DOMContentLoaded', function() {
        const path = window.location.pathname;
        document.querySelectorAll('.da-nav__link').forEach(link => {
            const href = link.getAttribute('href') || '';
            const cleanHref = href.replace(/^\//, '');
            if (cleanHref === '') {
                if (path === '/' || path === '') {
                    link.classList.add('is-active');
                }
            } else if (path.includes(cleanHref)) {
                link.classList.add('is-active');
            }
        });
    });
</script>
</body>
</html>
