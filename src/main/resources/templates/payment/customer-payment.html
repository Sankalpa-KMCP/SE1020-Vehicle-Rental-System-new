<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/customer-shell :: head(pageTitle='DriveAway | Checkout')}"></head>
<body class="customer-premium-theme customer-checkout-theme">
<div th:replace="~{fragments/customer-shell :: grain}"></div>
<nav th:replace="~{fragments/customer-shell :: topbar(activeNav='billing')}"></nav>

<main class="cp-shell">
    <section class="cp-page-head reveal">
        <nav class="cp-breadcrumb" aria-label="Breadcrumb">
            <a th:href="@{/customer/bookings}">Bookings</a>
            <i class="ph-bold ph-caret-right"></i>
            <span>Payment</span>
        </nav>
        <h1>Payment window</h1>
        <p>Your booking is confirmed. Payment is required before vehicle handover.</p>
    </section>

    <section class="cp-card cp-form-card reveal">
        <dl class="cp-meta-grid">
            <div class="cp-meta">
                <dt>Booking ID</dt>
                <dd th:text="${booking.id}">id</dd>
            </div>
            <div class="cp-meta">
                <dt>Vehicle ID</dt>
                <dd th:text="${booking.vehicleId}">v</dd>
            </div>
            <div class="cp-meta" style="grid-column: 1 / -1;">
                <dt>Amount due</dt>
                <dd style="font-size:1.75rem;color:var(--gold-soft);">LKR <span th:text="${#numbers.formatDecimal(payment.amount, 1, 2)}">0</span></dd>
            </div>
        </dl>

        <form th:action="@{/payments/customer/pay}" method="post" class="cp-form-grid" style="margin-top:1rem;">
            <input type="hidden" name="bookingId" th:value="${booking.id}"/>
            <div class="cp-field cp-field--full">
                <label for="method">Payment method</label>
                <select id="method" name="method" class="cp-select" required>
                    <option value="Card">Card (Payment Gateway)</option>
                    <option value="Cash">Cash</option>
                </select>
            </div>
            <div class="cp-field">
                <label for="cardNumber">Card number (demo)</label>
                <input id="cardNumber" type="text" maxlength="19" placeholder="4111 1111 1111 1111" class="cp-input"/>
            </div>
            <div class="cp-field">
                <label for="cvv">CVV (demo)</label>
                <input id="cvv" type="text" maxlength="4" placeholder="123" class="cp-input"/>
            </div>
            <div class="cp-field cp-field--full">
                <button type="submit" class="cp-btn" style="width:100%;justify-content:center;">Pay now</button>
            </div>
        </form>
    </section>
</main>
<script th:src="@{/js/customer-portal.js}"></script>
</body>
</html>
