<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Premium Obsidian Dark theme overrides matching Central Dashboard */
        body {
          background:
            radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.02) 1px, transparent 0),
            radial-gradient(ellipse 80% 50% at 0% 0%, rgba(201, 169, 98, 0.04), transparent 50%),
            radial-gradient(ellipse 60% 40% at 100% 0%, rgba(34, 211, 238, 0.03), transparent 45%),
            #050506 !important;
          background-size: 24px 24px, auto, auto, auto;
          color: #f4f2ee !important;
        }

        .bg-white, .bg-slate-\[50\], .bg-gray-100 { background: #0c0c0e !important; border-color: rgba(255,255,255,0.08) !important; color: #f4f2ee !important; }
        .text-gray-900, .text-gray-800, .text-gray-700 { color: #f4f2ee !important; }
        .text-gray-500, .text-gray-600, .text-slate-500 { color: #a8a6a0 !important; }
        .bg-slate-50, .bg-gray-50 { background: #050506 !important; border-color: rgba(255,255,255,0.08) !important; color: #f4f2ee !important; }
        .border-slate-100, .border-slate-200, .border-slate-600, .border-gray-200, .border-gray-100 { border-color: rgba(255,255,255,0.05) !important; }
        
        td, th, span:not(.font-bold):not(.text-blue-600), div, label, p, h1, h2, h3, select, input, dt, dd { color: #f4f2ee !important; }
        
        input, select { background-color: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: #f4f2ee !important; }
        input:focus, select:focus { border-color: #c9a962 !important; box-shadow: 0 0 0 2px rgba(201,169,98,0.2) !important; }
        
        button[type="submit"], .btn-primary, .bg-blue-600, .bg-slate-800, .bg-slate-700, .bg-sky-600 { background: #c9a962 !important; color: #050506 !important; border: none !important; }
        button[type="submit"]:hover, .btn-primary:hover { background: #e8d5a3 !important; }
        
        .text-emerald-700, .text-blue-700, .text-green-700 { color: #f4f2ee !important; }
        .bg-green-50, .bg-blue-50 { background-color: rgba(16,185,129,0.1) !important; border-color: rgba(16,185,129,0.2) !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-8 text-gray-800">
<div class="max-w-2xl mx-auto">
    <a th:href="@{/customer/bookings}" class="inline-block mb-6 text-sm font-bold text-blue-700">&larr; Back to My Bookings</a>
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
        <h1 class="text-3xl font-extrabold mb-2">Payment Window</h1>
        <p class="text-gray-500 mb-8">Your booking is confirmed. Payment is required before vehicle handover.</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="bg-gray-50 border border-gray-200 rounded-xl p-4">
                <p class="text-xs text-gray-500 font-bold uppercase">Booking ID</p>
                <p class="text-lg font-extrabold" th:text="${booking.id}">id</p>
            </div>
            <div class="bg-gray-50 border border-gray-200 rounded-xl p-4">
                <p class="text-xs text-gray-500 font-bold uppercase">Vehicle ID</p>
                <p class="text-lg font-extrabold" th:text="${booking.vehicleId}">v</p>
            </div>
            <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 md:col-span-2">
                <p class="text-xs text-gray-500 font-bold uppercase">Amount Due</p>
                <p class="text-3xl font-extrabold text-green-700">LKR <span th:text="${#numbers.formatDecimal(payment.amount, 1, 2)}">0</span></p>
            </div>
        </div>
        <form th:action="@{/payments/customer/pay}" method="post" class="space-y-5">
            <input type="hidden" name="bookingId" th:value="${booking.id}"/>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Payment Method</label>
                <select name="method" class="w-full border border-gray-300 rounded-xl px-4 py-3" required>
                    <option value="Card">Card (Payment Gateway)</option>
                    <option value="Cash">Cash</option>
                </select>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Card Number (Demo)</label>
                    <input type="text" maxlength="19" placeholder="4111 1111 1111 1111" class="w-full border border-gray-300 rounded-xl px-4 py-3"/>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">CVV (Demo)</label>
                    <input type="text" maxlength="4" placeholder="123" class="w-full border border-gray-300 rounded-xl px-4 py-3"/>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl">Pay Now</button>
        </form>
    </div>
</div>
</body>
</html>
