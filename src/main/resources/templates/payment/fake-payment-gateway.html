<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DriveAway | Fake Payment Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background: #F4F7F6; }
    </style>
</head>
<body class="min-h-screen text-gray-800">
<main class="max-w-5xl mx-auto px-6 py-10">
    <a th:href="@{/customer/billing}" class="inline-flex items-center gap-2 text-sm font-bold text-blue-700 hover:text-blue-900 mb-6">
        <i class="ph-bold ph-arrow-left"></i> Back to Billing
    </a>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
        <section class="lg:col-span-2 bg-slate-950 text-white rounded-2xl p-8 shadow-xl">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-12 h-12 rounded-xl bg-blue-500 flex items-center justify-center">
                    <i class="ph-bold ph-shield-check text-2xl"></i>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-wider text-slate-400 font-bold">Demo Gateway</p>
                    <h1 class="text-2xl font-extrabold">DriveAway Pay</h1>
                </div>
            </div>

            <div class="space-y-5">
                <div>
                    <p class="text-xs uppercase tracking-wider text-slate-400 font-bold mb-1">Booking ID</p>
                    <p class="font-mono text-sm bg-white/10 border border-white/10 rounded-xl px-4 py-3" th:text="${booking.id}">B001</p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-wider text-slate-400 font-bold mb-1">Vehicle</p>
                    <p class="text-lg font-bold" th:text="${vehicle != null ? vehicle.brand + ' ' + vehicle.model : booking.vehicleId}">Vehicle</p>
                </div>
                <div class="pt-5 border-t border-white/10">
                    <p class="text-xs uppercase tracking-wider text-slate-400 font-bold mb-1">Amount Due</p>
                    <p class="text-4xl font-extrabold text-emerald-300">$<span th:text="${#numbers.formatDecimal(payment.amount, 1, 2)}">0.00</span></p>
                </div>
                <div class="bg-white/10 border border-white/10 rounded-xl p-4">
                    <p class="text-sm text-slate-300">This is a fake gateway for coursework testing. No real card payment is processed.</p>
                </div>
            </div>
        </section>

        <section class="lg:col-span-3 bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
            <div class="flex items-center justify-between gap-4 mb-8">
                <div>
                    <p class="text-xs uppercase tracking-wider text-gray-400 font-bold mb-1">Secure Checkout</p>
                    <h2 class="text-3xl font-extrabold text-gray-900">Fake Payment Gateway</h2>
                </div>
                <span class="bg-yellow-50 text-yellow-800 border border-yellow-200 text-xs font-extrabold px-3 py-2 rounded-lg" th:text="${payment.status}">PENDING</span>
            </div>

            <form th:action="@{/customer/billing/gateway/complete}" method="post" class="space-y-5">
                <input type="hidden" name="bookingId" th:value="${booking.id}"/>

                <label class="block">
                    <span class="text-sm font-bold text-gray-700">Name on Card</span>
                    <input type="text" name="cardName" required placeholder="Demo Customer" class="mt-2 w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                </label>

                <label class="block">
                    <span class="text-sm font-bold text-gray-700">Card Number</span>
                    <input type="text" name="cardNumber" inputmode="numeric" maxlength="19" required placeholder="4111 1111 1111 1111" class="mt-2 w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                </label>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <label class="block">
                        <span class="text-sm font-bold text-gray-700">Expiry</span>
                        <input type="text" name="expiry" maxlength="5" required placeholder="12/30" class="mt-2 w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                    </label>
                    <label class="block">
                        <span class="text-sm font-bold text-gray-700">CVV</span>
                        <input type="password" name="cvv" maxlength="4" required placeholder="123" class="mt-2 w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                    </label>
                </div>

                <button type="submit" class="w-full bg-[#0D6EFD] hover:bg-blue-700 text-white font-extrabold py-4 rounded-xl transition shadow-sm flex items-center justify-center gap-2">
                    <i class="ph-bold ph-lock-key"></i> Pay Now
                </button>
            </form>
        </section>
    </div>
</main>
</body>
</html>
