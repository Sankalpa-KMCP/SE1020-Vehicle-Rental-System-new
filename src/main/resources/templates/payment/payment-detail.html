<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/admin-shell :: adminHead('Payment Detail - DriveAway')}"></th:block>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Premium Obsidian Dark theme overrides matching Central Dashboard */
        .admin-shell {
          --admin-navy: #050506;
          --admin-navy-mid: #0c0c0e;
          --admin-charcoal: #f4f2ee;
          --admin-charcoal-muted: #a8a6a0;
          --admin-bg: #050506;
          --admin-canvas: #050506;
          --admin-surface: #0c0c0e;
          --admin-glass: rgba(12, 12, 14, 0.85);
          --admin-text: #f4f2ee;
          --admin-text-muted: #a8a6a0;
          --admin-border: rgba(255, 255, 255, 0.08);

          background:
            radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.02) 1px, transparent 0),
            radial-gradient(ellipse 80% 50% at 0% 0%, rgba(201, 169, 98, 0.04), transparent 50%),
            radial-gradient(ellipse 60% 40% at 100% 0%, rgba(34, 211, 238, 0.03), transparent 45%),
            #050506 !important;
          background-size: 24px 24px, auto, auto, auto;
        }

        .admin-main {
          background:
            radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.02) 1px, transparent 0),
            radial-gradient(ellipse 80% 50% at 0% 0%, rgba(201, 169, 98, 0.05), transparent 50%),
            radial-gradient(ellipse 60% 40% at 100% 0%, rgba(34, 211, 238, 0.03), transparent 45%),
            var(--admin-navy) !important;
          background-size: 24px 24px, auto, auto, auto;
        }

        .admin-sidebar {
          background:
            radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.02) 1px, transparent 0),
            radial-gradient(ellipse 100% 35% at 50% 0%, rgba(201, 169, 98, 0.12), transparent 60%),
            linear-gradient(180deg, #050506 0%, #0c0c0e 45%, #020203 100%) !important;
          background-size: 20px 20px, auto, auto !important;
          border-right: 1px solid rgba(255, 255, 255, 0.06) !important;
        }

        .admin-topbar__menu-btn, .admin-topbar__collapse-btn, .admin-topbar__logout, .admin-topbar__user {
          background: rgba(255, 255, 255, 0.05) !important;
          border-color: rgba(255, 255, 255, 0.08) !important;
          color: #f4f2ee !important;
        }

        /* Box and Element Styles */
        .bg-white, .bg-slate-900, .bg-gray-100 { background: #0c0c0e !important; border-color: rgba(255,255,255,0.08) !important; color: #f4f2ee !important; }
        .text-gray-900, .text-gray-800, .text-gray-700 { color: #f4f2ee !important; }
        .text-gray-500, .text-gray-600, .text-slate-500 { color: #a8a6a0 !important; }
        .bg-slate-50, .bg-gray-50 { background: #050506 !important; border-color: rgba(255,255,255,0.08) !important; color: #f4f2ee !important; }
        .border-slate-100, .border-slate-200, .border-slate-600, .border-white\/20, .border-b, .border-gray-200, .border-gray-100 { border-color: rgba(255,255,255,0.05) !important; }
        
        .hover\:bg-emerald-50\/50:hover, .hover\:bg-gray-50:hover { background-color: rgba(201, 169, 98, 0.05) !important; }
        td, th, span:not(.font-bold), div, label, p, h1, h2, h3, select, input, dt, dd { color: #f4f2ee !important; }
        
        input, select { background-color: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: #f4f2ee !important; }
        input:focus, select:focus { border-color: #c9a962 !important; box-shadow: 0 0 0 2px rgba(201,169,98,0.2) !important; }
        
        button[type="submit"], .btn-primary, .bg-blue-600, .bg-slate-800, .bg-slate-700, .bg-sky-600 { background: #c9a962 !important; color: #050506 !important; border: none !important; }
        button[type="submit"]:hover, .btn-primary:hover, .hover\:bg-blue-700:hover, .hover\:bg-slate-900:hover, .hover\:bg-slate-600:hover, .hover\:bg-sky-500:hover { background: #e8d5a3 !important; }
        
        .bg-red-600 { background: #ef4444 !important; color: #050506 !important; }
        .hover\:bg-red-500:hover { background: #f87171 !important; color: #050506 !important; }
    </style>
</head>
<body class="admin-shell">
<th:block th:replace="~{fragments/admin-shell :: shellOpen('payments', 'Payment Detail')}"></th:block>
<div class="fade-in">
    <div class="bg-gradient-to-br from-[#141418] to-[#0a0a0b] border border-[#c9a962]/30 rounded-3xl p-10 sm:p-12 text-white shadow-lg mb-8 relative overflow-hidden">
        <div class="relative z-10">
            <h1 class="text-4xl sm:text-5xl font-extrabold mb-4 tracking-tight">Payment Details</h1>
            <p class="text-[#a8a6a0] text-lg font-medium max-w-2xl leading-relaxed">Full transaction trace and record metadata.</p>
        </div>
        <i class="ph-fill ph-receipt absolute -right-10 -bottom-20 text-[280px] text-white opacity-10 transform -rotate-12 pointer-events-none"></i>
    </div>
    <div class="bg-white border border-slate-200 rounded-3xl p-8 soft-card shadow-lg">
        <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-6">
            <div class="border-b border-white/5 pb-4">
                <dt class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Transaction ID</dt>
                <dd class="text-xl font-mono font-bold text-gray-900" th:text="${payment.id}">-</dd>
            </div>
            <div class="border-b border-white/5 pb-4">
                <dt class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Payment Method</dt>
                <dd class="text-xl font-bold text-emerald-700" th:text="${payment.paymentType}">-</dd>
            </div>
            <div class="border-b border-white/5 pb-4">
                <dt class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Linked Booking</dt>
                <dd class="text-xl font-mono font-bold text-gray-900" th:text="${payment.bookingId}">-</dd>
            </div>
            <div class="border-b border-white/5 pb-4">
                <dt class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Amount</dt>
                <dd class="text-3xl font-extrabold text-gray-900">$<span th:text="${#numbers.formatDecimal(payment.amount, 1, 2)}">0.00</span></dd>
            </div>
            <div class="border-b border-white/5 pb-4">
                <dt class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Current Status</dt>
                <dd class="mt-2">
                    <span th:if="${#strings.equalsIgnoreCase(payment.status, 'PAID')}" class="bg-green-50 text-green-700 border border-green-200 font-bold px-4 py-2 rounded-xl text-sm">PAID</span>
                    <span th:if="${#strings.equalsIgnoreCase(payment.status, 'PENDING')}" class="bg-amber-50 text-amber-700 border border-amber-200 font-bold px-4 py-2 rounded-xl text-sm">PENDING</span>
                    <span th:if="${#strings.equalsIgnoreCase(payment.status, 'VERIFYING')}" class="bg-blue-50 text-blue-700 border border-blue-200 font-bold px-4 py-2 rounded-xl text-sm">VERIFYING</span>
                    <span th:if="${!#strings.equalsIgnoreCase(payment.status, 'PAID') and !#strings.equalsIgnoreCase(payment.status, 'PENDING') and !#strings.equalsIgnoreCase(payment.status, 'VERIFYING')}" class="bg-slate-100 text-slate-800 font-bold px-4 py-2 rounded-xl text-sm" th:text="${payment.status}">s</span>
                </dd>
            </div>
        </dl>
    </div>
    <p class="actions">
        <a class="btn btn-ghost" th:href="@{/payments}">Back</a>
        <a class="btn btn-primary" th:href="@{/payments/{id}/edit(id=${payment.id})}">Edit</a>
    </p>
</div>
<th:block th:replace="~{fragments/admin-shell :: shellClose}"></th:block>
<script th:replace="~{fragments/admin-shell :: mobileScript}"></script>
</body>
</html>
