<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Payment</title>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/payment.css}"/>
</head>
<body>
<div th:replace="~{layout :: navbar}"></div>
<main class="container">
    <h1>Payment</h1>
    <dl>
        <dt>ID</dt>
        <dd th:text="${payment.id}">-</dd>
        <dt>Method</dt>
        <dd th:text="${payment.paymentType}">-</dd>
        <dt>Booking</dt>
        <dd th:text="${payment.bookingId}">-</dd>
        <dt>Amount</dt>
        <dd th:text="${payment.amount}">-</dd>
        <dt>Status</dt>
        <dd th:text="${payment.status}">-</dd>
    </dl>
    <p class="actions">
        <a class="btn btn-ghost" th:href="@{/payments}">Back</a>
        <a class="btn btn-primary" th:href="@{/payments/{id}/edit(id=${payment.id})}">Edit</a>
    </p>
</main>
</body>
</html>
