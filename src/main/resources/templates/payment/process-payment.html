<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/admin-shell :: adminHead('Process Payment - DriveAway')}"></th:block>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Premium Obsidian Dark theme overrides matching Central Dashboard */
        .admin-shell {
          --admin-navy: #050506;
          --admin-navy-mid: #0c0c0e;
          --admin-charcoal: #f4f2ee;
          --admin-charcoal-muted: #a8a6a0;
          --admin-bg: #050506;
          --admin-canvas: #050506;
          --admin-surface: #0c0c0e;
          --admin-glass: rgba(12, 12, 14, 0.85);
          --admin-text: #f4f2ee;
          --admin-text-muted: #a8a6a0;
          --admin-border: rgba(255, 255, 255, 0.08);

          background:
            radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.02) 1px, transparent 0),
            radial-gradient(ellipse 80% 50% at 0% 0%, rgba(201, 169, 98, 0.04), transparent 50%),
            radial-gradient(ellipse 60% 40% at 100% 0%, rgba(34, 211, 238, 0.03), transparent 45%),
            #050506 !important;
          background-size: 24px 24px, auto, auto, auto;
        }

        .admin-main {
          background:
            radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.02) 1px, transparent 0),
            radial-gradient(ellipse 80% 50% at 0% 0%, rgba(201, 169, 98, 0.05), transparent 50%),
            radial-gradient(ellipse 60% 40% at 100% 0%, rgba(34, 211, 238, 0.03), transparent 45%),
            var(--admin-navy) !important;
          background-size: 24px 24px, auto, auto, auto;
        }

        .admin-sidebar {
          background:
            radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.02) 1px, transparent 0),
            radial-gradient(ellipse 100% 35% at 50% 0%, rgba(201, 169, 98, 0.12), transparent 60%),
            linear-gradient(180deg, #050506 0%, #0c0c0e 45%, #020203 100%) !important;
          background-size: 20px 20px, auto, auto !important;
          border-right: 1px solid rgba(255, 255, 255, 0.06) !important;
        }

        .admin-topbar__menu-btn, .admin-topbar__collapse-btn, .admin-topbar__logout, .admin-topbar__user {
          background: rgba(255, 255, 255, 0.05) !important;
          border-color: rgba(255, 255, 255, 0.08) !important;
          color: #f4f2ee !important;
        }

        /* Box and Element Styles */
        .bg-white, .bg-slate-900, .bg-gray-100 { background: #0c0c0e !important; border-color: rgba(255,255,255,0.08) !important; color: #f4f2ee !important; }
        .text-gray-900, .text-gray-800, .text-gray-700 { color: #f4f2ee !important; }
        .text-gray-500, .text-gray-600, .text-slate-500 { color: #a8a6a0 !important; }
        .bg-slate-50, .bg-gray-50 { background: #050506 !important; border-color: rgba(255,255,255,0.08) !important; color: #f4f2ee !important; }
        .border-slate-100, .border-slate-200, .border-slate-600, .border-b, .border-gray-200, .border-gray-100 { border-color: rgba(255,255,255,0.05) !important; }
        
        .hover\:bg-gray-50:hover { background-color: rgba(201, 169, 98, 0.05) !important; }
        td, th, span:not(.font-bold), div, label, p, h1, h2, h3, select, input { color: #f4f2ee !important; }
        
        input, select { background-color: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: #f4f2ee !important; }
        input:focus, select:focus { border-color: #c9a962 !important; box-shadow: 0 0 0 2px rgba(201,169,98,0.2) !important; }
        
        button[type="submit"], .bg-blue-600, .bg-slate-800, .bg-slate-700, .bg-sky-600 { background: #c9a962 !important; color: #050506 !important; border: none !important; }
        button[type="submit"]:hover, .hover\:bg-blue-700:hover, .hover\:bg-slate-900:hover, .hover\:bg-slate-600:hover, .hover\:bg-sky-500:hover { background: #e8d5a3 !important; }
        
        .bg-red-600 { background: #ef4444 !important; color: #050506 !important; }
        .hover\:bg-red-500:hover { background: #f87171 !important; color: #050506 !important; }
    </style>
</head>
<body class="admin-shell">
<th:block th:replace="~{fragments/admin-shell :: shellOpen('payments', 'Process Payment')}"></th:block>
<div class="fade-in">

    <div class="bg-gradient-to-br from-[#141418] to-[#0a0a0b] border border-[#c9a962]/30 rounded-3xl p-10 sm:p-12 text-white shadow-lg mb-8 relative overflow-hidden">
        <div class="relative z-10">
            <h1 class="text-4xl sm:text-5xl font-extrabold mb-4 tracking-tight">Record Payment</h1>
            <p class="text-[#a8a6a0] text-lg font-medium max-w-2xl leading-relaxed">Manually log transaction data for over-the-counter bookings.</p>
        </div>
        <i class="ph-fill ph-plus-circle absolute -right-8 -bottom-16 text-[220px] text-white opacity-10 transform -rotate-12 pointer-events-none"></i>
    </div>

    <section class="bg-white rounded-3xl border border-slate-200 shadow-xl p-10">
        <div class="flex items-center gap-4 mb-8">
            <div class="w-14 h-14 rounded-2xl bg-[#c9a962]/10 text-[#c9a962] flex items-center justify-center text-2xl border border-[#c9a962]/30">
                <i class="ph ph-plus-circle"></i>
            </div>
            <div>
                <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">New Transaction</h2>
                <p class="text-gray-500 font-medium">Link a payment record to an existing booking.</p>
            </div>
        </div>

        <form th:action="@{/payments}" method="post" class="space-y-6">
            <input type="hidden" name="action" value="create"/>
            <div class="grid md:grid-cols-2 gap-6">
                <label class="block md:col-span-2">
                    <span class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 block">Select Booking</span>
                    <select name="bookingId" required class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-semibold text-gray-900">
                        <option value="">— Select booking reference —</option>
                        <option th:each="b : ${bookings}" th:value="${b.id}"
                                th:text="${b.id + ' (' + b.bookingType + ') — ' + b.status}">b</option>
                    </select>
                </label>
                <label class="block">
                    <span class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 block">Payment Amount ($)</span>
                    <input type="number" step="0.01" name="amount" required min="0" placeholder="0.00" class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-semibold text-gray-900"/>
                </label>
                <label class="block">
                    <span class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 block">Manual Payment ID (Optional)</span>
                    <input type="text" name="manualId" placeholder="Auto-generated if empty" class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-semibold text-gray-900"/>
                </label>
                <label class="block">
                    <span class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 block">Payment Method</span>
                    <select name="method" class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-semibold text-gray-900">
                        <option value="Card">Card Transaction</option>
                        <option value="Cash">Cash Deposit</option>
                    </select>
                </label>
                <label class="block">
                    <span class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 block">Registry Status</span>
                    <select name="status" class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-semibold text-gray-900">
                        <option value="PAID">PAID</option>
                        <option value="PENDING">PENDING</option>
                        <option value="REFUNDED">REFUNDED</option>
                    </select>
                </label>
            </div>
            <div class="pt-4">
                <button type="submit" class="w-full sm:w-auto bg-[#c9a962] hover:bg-[#e8d5a3] text-[#050506] font-extrabold px-10 py-4 rounded-xl shadow-lg shadow-[#c9a962]/10 transition-all flex items-center justify-center gap-2 transform hover:-translate-y-0.5">
                    <i class="ph-bold ph-check-circle text-lg"></i> Complete Transaction
                </button>
            </div>
        </form>
    </section>

    <section class="bg-slate-900 text-slate-100 rounded-3xl p-8 shadow-xl">
        <h2 class="text-lg font-extrabold mb-4 flex items-center gap-2">
            <i class="ph-bold ph-magnifying-glass text-sky-400"></i> Lookup payment
        </h2>
        <div class="flex flex-col sm:flex-row gap-3">
            <input type="text" id="searchPaymentId" placeholder="Payment ID" class="flex-1 border border-slate-600 bg-slate-800 rounded-xl px-4 py-3 font-mono text-sm focus:ring-2 focus:ring-sky-500 outline-none"/>
            <button type="button" onclick="handleSearch()" class="bg-slate-700 hover:bg-slate-600 font-bold px-5 py-3 rounded-xl transition">View</button>
            <button type="button" onclick="handleEdit()" class="bg-sky-600 hover:bg-sky-500 font-bold px-5 py-3 rounded-xl transition">Edit</button>
            <button type="button" onclick="handleDelete()" class="bg-red-600 hover:bg-red-500 font-bold px-5 py-3 rounded-xl transition">Delete</button>
        </div>
        <form id="deletePaymentForm" method="post" class="hidden" aria-hidden="true"></form>
    </section>

    <details class="bg-white rounded-3xl border border-slate-200 shadow-lg p-6 group">
        <summary class="font-extrabold text-gray-900 cursor-pointer list-none flex items-center justify-between">
            <span>Polymorphic quick entry</span>
            <i class="ph-bold ph-caret-down text-gray-400 group-open:rotate-180 transition-transform"></i>
        </summary>
        <div class="mt-6 pt-6 border-t border-gray-100">
            <form class="form-grid space-y-4" method="post" th:action="@{/payments}">
                <fieldset>
                    <legend class="text-sm font-bold text-gray-600 mb-2">Payment method</legend>
                    <div class="flex gap-4">
                        <label class="font-semibold"><input type="radio" name="paymentType" value="CARD" th:checked="${paymentType == 'CARD'}"/> Card</label>
                        <label class="font-semibold"><input type="radio" name="paymentType" value="CASH" th:checked="${paymentType == 'CASH'}"/> Cash</label>
                    </div>
                </fieldset>
                <div id="cardBlock" th:object="${cardPayment}">
                    <h3 class="font-bold text-gray-800 mb-2">Card</h3>
                    <label class="block text-sm font-semibold">Booking
                        <select th:field="*{bookingId}" required class="mt-1 w-full border rounded-lg px-3 py-2">
                            <option value="">—</option>
                            <option th:each="b : ${bookings}" th:value="${b.id}"
                                    th:text="${b.id + ' (' + b.bookingType + ')'}">b</option>
                        </select>
                    </label>
                    <label class="block text-sm font-semibold mt-2">Amount
                        <input type="number" step="0.01" min="0" th:field="*{amount}" required class="mt-1 w-full border rounded-lg px-3 py-2"/>
                    </label>
                    <label class="block text-sm font-semibold mt-2">Status
                        <input type="text" th:field="*{status}" placeholder="PAID" class="mt-1 w-full border rounded-lg px-3 py-2"/>
                    </label>
                </div>
                <div id="cashBlock" th:object="${cashPayment}">
                    <h3 class="font-bold text-gray-800 mb-2">Cash</h3>
                    <label class="block text-sm font-semibold">Booking
                        <select th:field="*{bookingId}" required class="mt-1 w-full border rounded-lg px-3 py-2">
                            <option value="">—</option>
                            <option th:each="b : ${bookings}" th:value="${b.id}"
                                    th:text="${b.id + ' (' + b.bookingType + ')'}">b</option>
                        </select>
                    </label>
                    <label class="block text-sm font-semibold mt-2">Amount
                        <input type="number" step="0.01" min="0" th:field="*{amount}" required class="mt-1 w-full border rounded-lg px-3 py-2"/>
                    </label>
                    <label class="block text-sm font-semibold mt-2">Status
                        <input type="text" th:field="*{status}" placeholder="PAID" class="mt-1 w-full border rounded-lg px-3 py-2"/>
                    </label>
                </div>
                <button type="submit" class="bg-slate-800 text-white font-bold py-3 px-6 rounded-xl hover:bg-slate-900">Save (polymorphic)</button>
            </form>
        </div>
    </details>
</div>
<th:block th:replace="~{fragments/admin-shell :: shellClose}"></th:block>
<script th:replace="~{fragments/admin-shell :: mobileScript}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    var paymentsBase = /*[[@{/payments}]]*/ '/payments';
    function handleSearch() {
        var id = document.getElementById('searchPaymentId').value.trim();
        if (!id) return;
        window.location.href = paymentsBase + '/' + encodeURIComponent(id);
    }
    function handleEdit() {
        var id = document.getElementById('searchPaymentId').value.trim();
        if (!id) return;
        window.location.href = paymentsBase + '/' + encodeURIComponent(id) + '/edit';
    }
    function handleDelete() {
        var id = document.getElementById('searchPaymentId').value.trim();
        if (!id) return;
        if (!confirm('Delete this payment record?')) return;
        var f = document.getElementById('deletePaymentForm');
        f.action = paymentsBase + '/' + encodeURIComponent(id) + '/delete';
        f.submit();
    }
    /*]]>*/
</script>
<script th:src="@{/js/payment.js}"></script>
</body>
</html>
