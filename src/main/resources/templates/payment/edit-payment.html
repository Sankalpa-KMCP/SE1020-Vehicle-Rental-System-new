<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Edit payment</title>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/payment.css}"/>
</head>
<body>
<div th:replace="~{layout :: navbar}"></div>
<main class="container">
    <h1>Edit payment</h1>
    <form class="form-grid" method="post"
          th:action="@{/payments/{id}(id=${entityId})}">
        <fieldset>
            <legend>Payment method</legend>
            <label><input type="radio" name="paymentType" value="CARD" th:checked="${paymentType == 'CARD'}"/> Card</label>
            <label><input type="radio" name="paymentType" value="CASH" th:checked="${paymentType == 'CASH'}"/> Cash</label>
        </fieldset>
        <div id="cardBlock" th:object="${cardPayment}">
            <h2>Card</h2>
            <label>Booking
                <select th:field="*{bookingId}" required>
                    <option value="">—</option>
                    <option th:each="b : ${bookings}" th:value="${b.id}"
                            th:text="${b.id + ' (' + b.bookingType + ')'}">b</option>
                </select>
            </label>
            <label>Amount <input type="number" step="0.01" min="0" th:field="*{amount}" required/></label>
            <label>Status <input type="text" th:field="*{status}" placeholder="PAID"/></label>
        </div>
        <div id="cashBlock" th:object="${cashPayment}">
            <h2>Cash</h2>
            <label>Booking
                <select th:field="*{bookingId}" required>
                    <option value="">—</option>
                    <option th:each="b : ${bookings}" th:value="${b.id}"
                            th:text="${b.id + ' (' + b.bookingType + ')'}">b</option>
                </select>
            </label>
            <label>Amount <input type="number" step="0.01" min="0" th:field="*{amount}" required/></label>
            <label>Status <input type="text" th:field="*{status}" placeholder="PAID"/></label>
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-ghost" th:href="@{/payments}">Cancel</a>
    </form>
</main>
<script th:src="@{/js/payment.js}"></script>
</body>
</html>
