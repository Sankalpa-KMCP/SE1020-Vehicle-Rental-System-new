<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Payments - DriveAway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top right, #dbeafe 0%, #f8fafc 45%, #f1f5f9 100%); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .soft-card { box-shadow: 0 10px 35px rgba(15, 23, 42, 0.06); }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col">
<th:block th:replace="~{fragments/layout :: globalPreloader}"></th:block>
<nav class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 border-b border-white/10 sticky top-0 z-20 shadow-lg backdrop-blur">
    <div class="max-w-screen-xl mx-auto px-8 h-20 flex items-center justify-between">
        <a th:href="@{/payments}" class="flex items-center gap-2 text-white">
            <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                <i class="ph-fill ph-currency-circle-dollar text-2xl text-sky-300"></i>
            </div>
            <span class="text-2xl font-extrabold tracking-tight">Payments</span>
        </a>
        <div class="flex items-center gap-4 flex-wrap justify-end">
            <a th:href="@{/payments/new}" class="text-sky-200 hover:text-white text-sm font-semibold flex items-center gap-1">
                <i class="ph-bold ph-plus-circle"></i> New Transaction
            </a>
            <a th:href="@{/user/admin-dashboard}" class="text-sky-200 hover:text-white font-semibold text-sm flex items-center gap-2">
                <i class="ph-bold ph-house"></i> Admin Hub
            </a>
            <form th:action="@{/auth}" method="post" class="inline">
                <input type="hidden" name="action" value="logout"/>
                <button type="submit" class="text-white hover:text-sky-200 font-bold border border-white/20 bg-white/10 hover:bg-white/20 px-5 py-2.5 rounded-xl transition-all flex items-center gap-2 text-sm shadow-sm">
                    Logout <i class="ph-bold ph-sign-out text-lg"></i>
                </button>
            </form>
        </div>
    </div>
</nav>
<main class="flex-grow max-w-screen-xl mx-auto w-full px-8 py-10 fade-in">
    <div class="bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-700 rounded-3xl p-10 text-white shadow-xl mb-10 relative overflow-hidden">
        <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div>
                <h1 class="text-4xl font-extrabold mb-2 tracking-tight">Payment Dashboard</h1>
                <p class="text-blue-100 text-lg font-medium max-w-2xl">Track transactions, statuses, and settlement totals.</p>
            </div>
            <div class="flex flex-wrap gap-3 bg-white/10 p-4 rounded-2xl backdrop-blur-sm border border-white/20">
                <div class="text-center px-4 border-r border-white/20">
                    <p class="text-blue-100 text-xs font-bold uppercase mb-1">Total txn</p>
                    <p class="text-white font-extrabold text-xl" th:text="${totalTransactions}">0</p>
                </div>
                <div class="text-center px-4 border-r border-white/20">
                    <p class="text-blue-100 text-xs font-bold uppercase mb-1">Paid</p>
                    <p class="text-white font-extrabold text-xl" th:text="${paidCount}">0</p>
                </div>
                <div class="text-center px-4 border-r border-white/20">
                    <p class="text-blue-100 text-xs font-bold uppercase mb-1">Pending</p>
                    <p class="text-white font-extrabold text-xl" th:text="${pendingCount}">0</p>
                </div>
                <div class="text-center px-4 border-r border-white/20">
                    <p class="text-blue-100 text-xs font-bold uppercase mb-1">Refunded</p>
                    <p class="text-white font-extrabold text-xl" th:text="${refundedCount}">0</p>
                </div>
                <div class="text-center px-4">
                    <p class="text-blue-100 text-xs font-bold uppercase mb-1">Volume</p>
                    <p class="text-white font-extrabold text-lg" th:text="${#numbers.formatDecimal(totalAmount, 1, 2)}">0</p>
                </div>
            </div>
        </div>
    </div>
    <div class="bg-white border border-slate-200 rounded-3xl p-8 soft-card shadow-lg">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-50 text-gray-500 text-xs uppercase tracking-widest border-b border-slate-200">
                    <th class="py-4 px-6 font-bold">ID</th>
                    <th class="py-4 px-6 font-bold">Method</th>
                    <th class="py-4 px-6 font-bold">Booking</th>
                    <th class="py-4 px-6 font-bold">Amount</th>
                    <th class="py-4 px-6 font-bold">Status</th>
                    <th class="py-4 px-6 font-bold text-right">Actions</th>
                </tr>
                </thead>
                <tbody class="text-gray-700">
                <tr th:each="p : ${payments}" class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                    <td class="py-5 px-6 font-mono font-bold text-gray-900" th:text="${p.id}">id</td>
                    <td class="py-5 px-6 text-sm font-semibold text-indigo-700" th:text="${p.paymentMethod}">m</td>
                    <td class="py-5 px-6"><span class="bg-gray-100 px-2 py-1 rounded text-sm font-mono" th:text="${p.bookingId}">b</span></td>
                    <td class="py-5 px-6 font-bold" th:text="${#numbers.formatDecimal(p.amount, 1, 2)}">0</td>
                    <td class="py-5 px-6">
                        <span class="bg-slate-100 text-slate-800 font-bold px-3 py-1 rounded-lg text-xs" th:text="${p.status}">s</span>
                    </td>
                    <td class="py-5 px-6 text-right space-x-2">
                        <a th:href="@{/payments/{id}(id=${p.id})}" class="inline-flex items-center gap-1 text-gray-500 hover:text-gray-800 font-bold text-sm">
                            <i class="ph-bold ph-eye"></i>
                        </a>
                        <a th:href="@{/payments/{id}/edit(id=${p.id})}" class="inline-flex items-center gap-1 text-blue-600 hover:text-blue-800 font-bold text-sm">
                            <i class="ph-bold ph-pencil-simple"></i>
                        </a>
                        <form th:action="@{/payments/{id}/delete(id=${p.id})}" method="post" class="inline" onsubmit="return confirm('Delete this payment record?');">
                            <button type="submit" class="inline-flex items-center gap-1 text-red-500 hover:text-red-700 font-bold text-sm align-middle">
                                <i class="ph-bold ph-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${payments == null or payments.isEmpty()}">
                    <td colspan="6" class="py-12 text-center text-gray-500 font-medium">No payment records yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
