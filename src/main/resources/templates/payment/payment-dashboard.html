<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Payments</title>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/payment.css}"/>
</head>
<body>
<div th:replace="~{layout :: navbar}"></div>
<main class="container">
    <h1>Payments</h1>
    <p><a class="btn btn-primary" th:href="@{/payments/new}">Record payment</a></p>
    <div class="stack">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Booking</th>
                <th>Amount</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${payments}">
                <td th:text="${p.id}">id</td>
                <td th:text="${p.paymentType}">CARD</td>
                <td th:text="${p.bookingId}">b</td>
                <td th:text="${p.amount}">0</td>
                <td th:text="${p.status}">t</td>
                <td class="actions">
                    <a class="btn btn-ghost" th:href="@{/payments/{id}(id=${p.id})}">View</a>
                    <a class="btn btn-ghost" th:href="@{/payments/{id}/edit(id=${p.id})}">Edit</a>
                    <form th:action="@{/payments/{id}/delete(id=${p.id})}" method="post" style="display:inline">
                        <button class="btn btn-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
