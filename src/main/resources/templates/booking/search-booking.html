<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Search bookings - DriveAway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-50 text-gray-800">
<nav class="bg-gradient-to-r from-cyan-900 via-teal-900 to-emerald-900 border-b border-white/10 shadow-lg">
    <div class="max-w-screen-xl mx-auto px-6 h-16 flex items-center justify-between text-white">
        <a th:href="@{/admin/reservations}" class="font-extrabold flex items-center gap-2">
            <i class="ph-bold ph-arrow-left"></i> Reservations
        </a>
        <a th:href="@{/user/admin-dashboard}" class="text-cyan-200 text-sm font-semibold">Admin hub</a>
    </div>
</nav>
<main class="max-w-xl mx-auto px-6 py-12">
    <h1 class="text-3xl font-extrabold mb-2">Search bookings</h1>
    <p class="text-gray-600 mb-8">Filter by booking ID, customer username, vehicle ID, or status. Leave blank on the results page to list everything.</p>
    <form th:action="@{/admin/reservations/view-all}" method="get" class="bg-white rounded-2xl shadow border border-slate-200 p-8 space-y-5">
        <label class="block text-sm font-bold text-gray-700">Keywords</label>
        <input type="search" name="q" class="w-full border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-teal-500 outline-none"
               placeholder="e.g. PENDING, EMP-01, V-001"/>
        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2">
            <i class="ph-bold ph-magnifying-glass"></i> View filtered list
        </button>
        <a th:href="@{/admin/reservations/view-all}" class="block text-center text-teal-700 font-semibold text-sm hover:underline">Show all bookings</a>
    </form>
</main>
</body>
</html>
