<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/admin-shell :: adminHead('Booking Detail - DriveAway')}"></th:block>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="admin-shell text-gray-800">
<th:block th:replace="~{fragments/admin-shell :: shellOpen('bookings', 'Booking Detail')}"></th:block>
<div class="fade-in">

<div th:replace="~{layout :: navbar}"></div>
<h1>Booking</h1>
    <dl>
        <dt>ID</dt>
        <dd th:text="${booking.id}">-</dd>
        <dt>Type</dt>
        <dd th:text="${booking.bookingType}">-</dd>
        <dt>Customer</dt>
        <dd th:text="${booking.customerName}">-</dd>
        <dt>Vehicle</dt>
        <dd th:text="${booking.vehicleId}">-</dd>
        <dt>Rental start</dt>
        <dd th:text="${booking.rentalDate}">-</dd>
        <dt>Duration (days)</dt>
        <dd th:text="${booking.durationDays}">-</dd>
        <dt>Status</dt>
        <dd th:text="${booking.status}">-</dd>
        <dt>Staff message</dt>
        <dd th:text="${booking.staffMessage}">-</dd>
    </dl>
    <p class="actions">
        <a class="btn btn-ghost" th:href="@{/bookings}">Back</a>
        <a class="btn btn-primary" th:href="@{/bookings/{id}/edit(id=${booking.id})}">Edit</a>
    </p>
</div>
<th:block th:replace="~{fragments/admin-shell :: shellClose}"></th:block>
<script th:replace="~{fragments/admin-shell :: mobileScript}"></script>
</body>
</html>
