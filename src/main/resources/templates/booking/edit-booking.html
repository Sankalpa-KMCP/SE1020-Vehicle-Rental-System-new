<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Modify booking - DriveAway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>body { font-family: 'Inter', sans-serif; background: #f8fafc; }</style>
</head>
<body class="min-h-screen p-6 md:p-10">
<div class="max-w-lg mx-auto bg-white rounded-2xl shadow border border-gray-100 p-8">
    <div class="flex justify-between items-start mb-6">
        <div>
            <h1 class="text-2xl font-extrabold text-gray-900">Modify booking</h1>
            <p class="text-gray-500 text-sm mt-1">Booking <span class="font-mono font-bold" th:text="${booking.id}">id</span></p>
        </div>
        <a th:href="@{/customer/bookings}" class="text-blue-600 font-semibold text-sm hover:underline">Cancel</a>
    </div>
    <div class="rounded-xl bg-slate-50 border border-slate-100 p-4 mb-6 text-sm space-y-1">
        <p><span class="text-gray-500">Vehicle:</span> <span class="font-mono font-semibold" th:text="${booking.vehicleId}">v</span></p>
        <p><span class="text-gray-500">Status:</span> <span class="font-semibold" th:text="${booking.status}">s</span></p>
    </div>
    <form th:action="@{/customer/bookings/{id}/edit(id=${booking.id})}" method="post" class="space-y-5">
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Rental start date</label>
            <input type="text" name="rentalDate" required th:value="${booking.rentalDate}"
                   class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
                   placeholder="YYYY-MM-DD or your stored format"/>
            <p class="text-xs text-gray-400 mt-1">Use the same date format as when you created the booking.</p>
        </div>
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Duration (days)</label>
            <input type="number" name="days" min="1" required th:value="${booking.days}"
                   class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"/>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2">
            <i class="ph-bold ph-floppy-disk"></i> Save changes
        </button>
    </form>
</div>
</body>
</html>
