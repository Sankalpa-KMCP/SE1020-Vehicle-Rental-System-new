<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/customer-shell :: head(pageTitle='DriveAway | Edit Booking')}"></head>
<body class="customer-premium-theme customer-portal-theme">
<div th:replace="~{fragments/customer-shell :: grain}"></div>
<nav th:replace="~{fragments/customer-shell :: topbar(activeNav='bookings')}"></nav>

<main class="cp-shell">
    <section class="cp-page-head reveal">
        <nav class="cp-breadcrumb" aria-label="Breadcrumb">
            <a th:href="@{/customer/bookings}">Bookings</a>
            <i class="ph-bold ph-caret-right"></i>
            <span>Edit booking</span>
        </nav>
        <h1>Modify dates</h1>
        <p>Update your rental date and duration. Changes apply while the booking is still pending.</p>
    </section>

    <section class="cp-alert cp-alert--warning reveal">
        <i class="ph-fill ph-pencil-simple"></i>
        <span>You are editing booking <strong th:text="${booking.id}">ID</strong>. Only pending bookings can be changed directly.</span>
    </section>

    <section class="cp-card cp-form-card reveal">
        <form th:action="@{/customer/bookings/{id}/edit(id=${booking.id})}" method="post" class="cp-form-grid">
            <div class="cp-field cp-field--full">
                <label>Customer name</label>
                <input type="text" name="customerName" th:value="${booking.customerName}" readonly class="cp-input"/>
            </div>
            <div class="cp-field cp-field--full">
                <label>Vehicle ID</label>
                <input type="text" name="vehicleId" th:value="${booking.vehicleId}" readonly class="cp-input"/>
            </div>
            <div class="cp-field">
                <label for="rentalDate">New rental date</label>
                <input id="rentalDate" type="date" name="rentalDate" th:value="${booking.rentalDate}" required class="cp-input"/>
            </div>
            <div class="cp-field">
                <label for="days">Duration (days)</label>
                <input id="days" type="number" name="days" th:value="${booking.days}" min="1" required class="cp-input"/>
            </div>
            <div class="cp-actions-row cp-field--full">
                <a th:href="@{/customer/bookings}" class="cp-btn-secondary">Cancel</a>
                <button type="submit" class="cp-btn">
                    <i class="ph-bold ph-floppy-disk"></i> Save changes
                </button>
            </div>
        </form>
    </section>
</main>
<script th:src="@{/js/customer-portal.js}"></script>
</body>
</html>
