<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>All bookings - DriveAway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-50 text-gray-800">
<nav class="bg-gradient-to-r from-cyan-900 via-teal-900 to-emerald-900 border-b border-white/10 shadow-lg">
    <div class="max-w-screen-xl mx-auto px-6 h-16 flex items-center justify-between text-white flex-wrap gap-2">
        <div class="flex items-center gap-4">
            <a th:href="@{/admin/reservations}" class="font-extrabold flex items-center gap-2">
                <i class="ph-bold ph-arrow-left"></i> Dashboard
            </a>
            <a th:href="@{/admin/reservations/search}" class="text-cyan-200 text-sm font-semibold">Search again</a>
        </div>
        <a th:href="@{/user/admin-dashboard}" class="text-cyan-200 text-sm font-semibold">Admin hub</a>
    </div>
</nav>
<main class="max-w-screen-xl mx-auto px-6 py-10">
    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-8">
        <div>
            <h1 class="text-3xl font-extrabold">All bookings</h1>
            <p class="text-gray-600 mt-1" th:if="${searchQuery != null and !searchQuery.isEmpty()}">
                Filter: <span class="font-mono font-bold text-teal-800" th:text="${searchQuery}">q</span>
            </p>
            <p class="text-gray-600 mt-1" th:if="${searchQuery == null or searchQuery.isEmpty()}">Showing the full directory.</p>
        </div>
        <form th:action="@{/admin/reservations/view-all}" method="get" class="flex gap-2">
            <input type="search" name="q" th:value="${searchQuery}" placeholder="Refine…"
                   class="border border-slate-200 rounded-xl px-3 py-2 min-w-[12rem]"/>
            <button type="submit" class="bg-teal-600 text-white font-bold px-4 py-2 rounded-xl">Go</button>
        </form>
    </div>
    <div class="bg-white rounded-2xl shadow border border-slate-200 overflow-x-auto">
        <table class="w-full text-left text-sm">
            <thead class="bg-slate-100 text-slate-600 uppercase text-xs tracking-wide">
            <tr>
                <th class="py-3 px-4 font-bold">ID</th>
                <th class="py-3 px-4 font-bold">Customer</th>
                <th class="py-3 px-4 font-bold">Vehicle</th>
                <th class="py-3 px-4 font-bold">Date</th>
                <th class="py-3 px-4 font-bold">Days</th>
                <th class="py-3 px-4 font-bold">Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${bookingList}" class="border-t border-slate-100 hover:bg-slate-50">
                <td class="py-3 px-4 font-mono font-bold" th:text="${b.id}">id</td>
                <td class="py-3 px-4" th:text="${b.customerName}">c</td>
                <td class="py-3 px-4 font-mono" th:text="${b.vehicleId}">v</td>
                <td class="py-3 px-4" th:text="${b.rentalDate}">d</td>
                <td class="py-3 px-4" th:text="${b.days}">1</td>
                <td class="py-3 px-4"><span class="font-semibold" th:text="${b.status}">S</span></td>
            </tr>
            <tr th:if="${bookingList == null or bookingList.isEmpty()}">
                <td colspan="6" class="py-10 px-4 text-center text-gray-500">No bookings match this filter.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
