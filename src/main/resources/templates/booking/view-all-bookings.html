<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>All Bookings - DriveAway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top, #ccfbf1 0%, #f8fafc 40%, #f1f5f9 100%); }</style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col">
<th:block th:replace="~{fragments/layout :: globalPreloader}"></th:block>
<nav class="bg-gradient-to-r from-teal-800 via-cyan-800 to-slate-900 border-b border-white/10 sticky top-0 z-20 shadow-lg">
    <div class="max-w-screen-xl mx-auto px-8 h-16 flex items-center justify-between text-white">
        <h1 class="text-xl font-extrabold tracking-tight">All bookings</h1>
        <a th:href="@{/bookings/new}" class="text-sm font-bold text-cyan-200 hover:text-white flex items-center gap-2">
            <i class="ph-bold ph-x-circle"></i> Close
        </a>
    </div>
</nav>
<main class="flex-grow max-w-screen-xl mx-auto w-full px-8 py-10">
    <div class="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-50 text-gray-500 text-xs uppercase tracking-widest border-b border-slate-200">
                    <th class="py-4 px-6 font-bold">ID</th>
                    <th class="py-4 px-6 font-bold">Customer</th>
                    <th class="py-4 px-6 font-bold">Vehicle</th>
                    <th class="py-4 px-6 font-bold">Date / Days</th>
                    <th class="py-4 px-6 font-bold">Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookingList}" class="border-b border-slate-100 hover:bg-slate-50">
                    <td class="py-4 px-6 font-mono font-bold" th:text="${b.id}">id</td>
                    <td class="py-4 px-6 font-semibold" th:text="${b.customerName}">c</td>
                    <td class="py-4 px-6 font-mono text-sm" th:text="${b.vehicleId}">v</td>
                    <td class="py-4 px-6 text-sm">
                        <div th:text="${b.rentalDate}">d</div>
                        <div class="text-gray-400 text-xs"><span th:text="${b.days}">1</span> days</div>
                    </td>
                    <td class="py-4 px-6">
                        <span class="bg-slate-100 text-slate-800 font-bold px-3 py-1 rounded-lg text-xs" th:text="${b.status}">s</span>
                    </td>
                </tr>
                <tr th:if="${bookingList == null or bookingList.isEmpty()}">
                    <td colspan="5" class="py-12 text-center text-gray-500 font-medium">No bookings in the system.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
