<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>My Bookings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>body { font-family: 'Inter', sans-serif; background: #f8fafc; }</style>
</head>
<body class="min-h-screen p-8">
<div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-extrabold text-gray-900">My Bookings</h1>
        <a th:href="@{/customer/home}" class="text-blue-600 font-bold hover:underline">← Portal</a>
    </div>
    <div class="bg-white rounded-2xl shadow border border-gray-100 overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
            <tr>
                <th class="p-4">ID</th>
                <th class="p-4">Vehicle</th>
                <th class="p-4">Date</th>
                <th class="p-4">Days</th>
                <th class="p-4">Status</th>
                <th class="p-4 text-right">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${bookingList}" class="border-t border-gray-100">
                <td class="p-4 font-mono font-bold" th:text="${b.id}">id</td>
                <td class="p-4" th:text="${b.vehicleId}">v</td>
                <td class="p-4" th:text="${b.rentalDate}">d</td>
                <td class="p-4" th:text="${b.days}">1</td>
                <td class="p-4"><span class="text-sm font-semibold text-gray-700" th:text="${b.status}">S</span></td>
                <td class="p-4 text-right space-x-2">
                    <a th:if="${payAllowed != null and payAllowed.get(b.id)}" th:href="@{/customer/pay(bookingId=${b.id})}" class="text-green-600 font-bold text-sm">Pay</a>
                    <a th:href="@{/customer/bookings/{bid}/cancel(bid=${b.id})}" class="text-red-600 font-bold text-sm">Cancel</a>
                </td>
            </tr>
            <tr th:if="${bookingList == null or bookingList.isEmpty()}">
                <td colspan="6" class="p-8 text-center text-gray-500">No bookings yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
    <p th:if="${param.payment != null}" class="mt-4 text-amber-700 text-sm font-medium">Payment information could not be loaded.</p>
</div>
</body>
</html>
