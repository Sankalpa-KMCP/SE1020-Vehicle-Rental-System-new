<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/admin-shell :: adminHead('Booking Form - DriveAway')}"></th:block>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <link rel="stylesheet" th:href="@{/css/booking.css}"/>
</head>
<body class="admin-shell booking-theme text-gray-800">
<th:block th:replace="~{fragments/admin-shell :: shellOpen('bookings', 'Booking Form')}"></th:block>
<div class="fade-in">

<div class="bg-white border border-slate-200 rounded-3xl p-10 soft-card shadow-lg max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-extrabold text-gray-900" th:text="${mode == 'edit'} ? 'Edit Booking' : 'New Booking'">Booking</h1>
        <a th:href="@{/bookings}" class="text-gray-500 hover:text-gray-700 font-medium">← Back to Bookings</a>
    </div>

    <form class="space-y-6" method="post"
          th:action="@{${entityId != null ? '/bookings/' + entityId : '/bookings'}}"
          th:object="${booking}">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-50 rounded-2xl p-6">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Customer</label>
                <select th:field="*{customerName}" required class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-cyan-400 outline-none">
                    <option value="">Select customer...</option>
                    <option th:each="c : ${customers}" th:value="${c.username}"
                            th:text="${c.username + ' (' + c.id + ')'}">c</option>
                </select>
            </div>
            <div class="bg-slate-50 rounded-2xl p-6">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Vehicle</label>
                <select th:field="*{vehicleId}" required class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-cyan-400 outline-none">
                    <option value="">Select vehicle...</option>
                    <option th:each="v : ${vehicles}" th:value="${v.id}"
                            th:text="${v.brand + ' ' + v.model + ' (' + v.id + ')'}">v</option>
                </select>
            </div>
            <div class="bg-slate-50 rounded-2xl p-6">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Rental Start Date</label>
                <input type="date" th:field="*{rentalDate}" required class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-cyan-400 outline-none"/>
            </div>
            <div class="bg-slate-50 rounded-2xl p-6">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Duration (Days)</label>
                <input type="number" min="1" th:field="*{durationDays}" required class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-cyan-400 outline-none"/>
            </div>
        </div>
        <div class="bg-slate-50 rounded-2xl p-6">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Status</label>
            <select th:field="*{status}" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-cyan-400 outline-none">
                <option value="PENDING">🟡 Pending </option>
                <option value="CONFIRMED">🟢 Confirmed </option>
                <option value="RENTED">🚗 Rented </option>
                <option value="COMPLETED">✅ Completed</option>
                <option value="CANCELLED">❌ Cancelled</option>

            </select>
        </div>
        <div class="bg-slate-50 rounded-2xl p-6">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Staff Message</label>
            <textarea th:field="*{staffMessage}" rows="3" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-cyan-400 outline-none resize-none"></textarea>
        </div>
        <div class="flex gap-4">
            <button type="submit" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold px-8 py-3 rounded-xl transition-all flex items-center gap-2">
                <i class="ph-bold ph-check"></i> Save Booking
            </button>
            <a th:href="@{/bookings}" class="bg-gray-100 text-gray-600 hover:bg-gray-200 font-bold px-8 py-3 rounded-xl transition-all flex items-center gap-2">
                <i class="ph-bold ph-x"></i> Cancel
            </a>
        </div>
    </form>
</div>
</div>
<th:block th:replace="~{fragments/admin-shell :: shellClose}"></th:block>
<script th:replace="~{fragments/admin-shell :: mobileScript}"></script>
</body>
</html>
