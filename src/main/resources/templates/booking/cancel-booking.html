<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/customer-shell :: head(pageTitle='DriveAway | Cancel Booking')}"></head>
<body class="customer-premium-theme customer-portal-theme">
<div th:replace="~{fragments/customer-shell :: grain}"></div>
<nav th:replace="~{fragments/customer-shell :: topbar(activeNav='bookings')}"></nav>

<main class="cp-shell">
    <section class="cp-page-head reveal">
        <nav class="cp-breadcrumb" aria-label="Breadcrumb">
            <a th:href="@{/customer/bookings}">Bookings</a>
            <i class="ph-bold ph-caret-right"></i>
            <span>Cancel request</span>
        </nav>
        <h1>Cancel booking</h1>
        <p>Submit a cancellation request for staff review.</p>
    </section>

    <section class="cp-card cp-form-card cp-form-card--destructive reveal">
        <div class="cp-alert cp-alert--error">
            <i class="ph-fill ph-warning-circle"></i>
            <span>You are requesting to cancel reservation <strong th:text="'#' + ${bookingToCancel.id}">#</strong>.
                Staff must approve this request before it is finalized.</span>
        </div>

        <form th:action="@{/customer/bookings/cancel-request}" method="post" class="cp-form-grid">
            <input type="hidden" name="id" th:value="${bookingToCancel.id}"/>

            <dl class="cp-meta-grid cp-field--full">
                <div class="cp-meta">
                    <dt>Vehicle</dt>
                    <dd th:text="${bookingToCancel.vehicleId}">V</dd>
                </div>
                <div class="cp-meta">
                    <dt>Rental date</dt>
                    <dd th:text="${bookingToCancel.rentalDate}">D</dd>
                </div>
            </dl>

            <div class="cp-field cp-field--full">
                <label for="cancelReason">Reason for cancellation</label>
                <textarea id="cancelReason" name="cancelReason" required placeholder="Please explain why you need to cancel..." class="cp-textarea"></textarea>
            </div>

            <div class="cp-actions-row cp-field--full">
                <a th:href="@{/customer/bookings}" class="cp-btn-secondary">Go back</a>
                <button type="submit" class="cp-btn" style="background: linear-gradient(135deg, #6b3024 0%, #9d5d46 100%);"
                        onclick="return confirm('Submit this cancellation request?');">
                    Confirm request
                </button>
            </div>
        </form>
    </section>
</main>
<script th:src="@{/js/customer-portal.js}"></script>
</body>
</html>
