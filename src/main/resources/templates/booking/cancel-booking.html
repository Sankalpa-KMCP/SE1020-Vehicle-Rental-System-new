<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Cancel Reservation - DriveAway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>body { font-family: 'Inter', sans-serif; }</style>
  <link rel="stylesheet" th:href="@{/css/booking.css}"/>
</head>
<body class="booking-theme bg-[#FAFAFA] min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-xl bg-white p-10 rounded-[24px] shadow-lg border-[3px] border-[#EF4444]">
  <div class="flex justify-between items-center mb-8">
    <h2 class="text-3xl font-bold text-[#EF4444] flex items-center gap-3">
      <i class="ph-bold ph-warning-circle"></i> Cancel Booking
    </h2>
    <a th:href="@{/customer/home}" class="text-gray-400 hover:text-gray-600 transition-colors">
      <i class="ph-bold ph-x text-2xl"></i>
    </a>
  </div>
  <div class="bg-red-50 border border-red-100 p-5 rounded-2xl mb-8">
    <p class="text-red-800 font-semibold mb-1">Warning: Irreversible Action</p>
    <p class="text-red-600 text-sm">
      You are requesting to cancel reservation <span class="font-bold" th:text="'#' + ${bookingToCancel.transactionId}">#</span>.
      Staff must approve this request before it is finalized.
    </p>
  </div>
  <form th:action="@{/customer/bookings/cancel-request}" method="post" class="space-y-6">
    <input type="hidden" name="id" th:value="${bookingToCancel.transactionId}"/>
    <div class="grid grid-cols-2 gap-6 bg-gray-50 p-4 rounded-xl border border-gray-100">
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Vehicle</label>
        <p class="font-bold text-gray-700" th:text="${bookingToCancel.vehicleId}">V</p>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Rental Date</label>
        <p class="font-bold text-gray-700" th:text="${bookingToCancel.rentalDate}">D</p>
      </div>
    </div>
    <div>
      <label class="block font-bold text-gray-700 mb-2">Reason for Cancellation</label>
      <textarea name="cancelReason" required placeholder="Please explain why you need to cancel..."
                class="w-full border border-gray-300 rounded-xl p-4 h-32 outline-none focus:border-[#EF4444] focus:ring-2 focus:ring-red-100 transition-all resize-none"></textarea>
    </div>
    <div class="flex gap-4 pt-4">
      <a th:href="@{/customer/home}" class="flex-1 text-center bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-4 rounded-xl transition-all">Go Back</a>
      <button type="submit" onclick="return confirm('Submit this cancellation request?');"
              class="flex-1 bg-[#EF4444] hover:bg-red-700 text-white font-bold py-4 rounded-xl shadow-md transition-all">Confirm Request</button>
    </div>
  </form>
</div>
</body>
</html>
