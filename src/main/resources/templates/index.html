<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DriveAway | Premium Vehicle Rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&amp;w=1920&amp;auto=format&amp;fit=crop"/>
    <link rel="stylesheet" th:href="@{/css/index-landing.css}"/>
</head>
<body class="index-landing text-gray-900 antialiased selection:bg-[#0D6EFD] selection:text-white">

<div id="welcome-overlay">
    <div class="welcome-bg-circle"></div>
    <div class="welcome-bg-circle"></div>
    <div class="welcome-bg-circle"></div>
    <div class="welcome-particles">
        <div class="welcome-particle"></div>
        <div class="welcome-particle"></div>
        <div class="welcome-particle"></div>
    </div>
    <div class="welcome-text">Welcome</div>
</div>

<div id="page-loader" role="status" aria-live="polite" aria-busy="true">
    <div class="loader-aurora" aria-hidden="true"></div>
    <div class="loader-bokeh loader-bokeh--1" aria-hidden="true"></div>
    <div class="loader-bokeh loader-bokeh--2" aria-hidden="true"></div>
    <div class="loader-bokeh loader-bokeh--3" aria-hidden="true"></div>
    <div class="loader-vignette" aria-hidden="true"></div>
    <div class="loader-content">
        <p class="loader-wordmark">
            <span class="loader-char">D</span><span class="loader-char">r</span><span class="loader-char">i</span><span class="loader-char">v</span><span class="loader-char">e</span><span class="loader-char">A</span><span class="loader-char">w</span><span class="loader-char">a</span><span class="loader-char">y</span>
        </p>
        <p class="loader-tagline">Premium vehicle rentals</p>
        <div class="loader-progress" aria-hidden="true"><span class="loader-progress-inner"></span></div>
    </div>
</div>

<div class="index-landing-shell">
<div th:replace="~{fragments/index-landing-nav :: indexNav}"></div>

<div class="parallax-bg" id="parallax-bg" aria-hidden="true"></div>

<th:block th:replace="~{fragments/index-main :: landingMain}"></th:block>

<div th:replace="~{fragments/index-landing-footer :: indexFooter}"></div>
</div>

<script th:src="@{/js/index-landing.js}"></script>
</body>
</html>
