<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Fleet Management - DriveAway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top left, #e0e7ff 0%, #f8fafc 40%, #f1f5f9 100%); }
        .fade-in { animation: fadeIn 0.45s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .soft-card { box-shadow: 0 10px 35px rgba(15, 23, 42, 0.07); }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col">
<th:block th:replace="~{fragments/layout :: globalPreloader}"></th:block>
<nav class="bg-gradient-to-r from-indigo-900 via-slate-900 to-slate-800 border-b border-white/10 sticky top-0 z-20 shadow-lg backdrop-blur">
    <div class="max-w-screen-xl mx-auto px-8 h-20 flex items-center justify-between">
        <a th:href="@{/vehicles}" class="flex items-center gap-2 text-white">
            <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                <i class="ph-fill ph-car-profile text-2xl text-indigo-300"></i>
            </div>
            <span class="text-2xl font-extrabold tracking-tight">Fleet</span>
        </a>
        <div class="flex items-center gap-3 flex-wrap justify-end">
            <a th:href="@{/vehicles/add}" class="text-indigo-200 hover:text-white text-sm font-semibold">Add</a>
            <a th:href="@{/user/admin-dashboard}" class="text-indigo-200 hover:text-white font-semibold text-sm flex items-center gap-2">
                <i class="ph-bold ph-house"></i> Admin Hub
            </a>
            <form th:action="@{/auth}" method="post" class="inline">
                <input type="hidden" name="action" value="logout"/>
                <button type="submit" class="text-white hover:text-indigo-200 font-bold border border-white/20 bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl text-sm transition-all flex items-center gap-2">
                    Logout <i class="ph-bold ph-sign-out text-lg"></i>
                </button>
            </form>
        </div>
    </div>
</nav>
<main class="flex-grow max-w-screen-xl mx-auto w-full px-8 py-10 fade-in">
    <div class="bg-gradient-to-br from-indigo-600 via-blue-600 to-sky-600 rounded-3xl p-10 text-white shadow-xl mb-10 relative overflow-hidden">
        <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div>
                <h1 class="text-4xl font-extrabold mb-2 tracking-tight">Vehicle Directory</h1>
                <p class="text-indigo-100 text-lg font-medium max-w-2xl">Manage cars and motorcycles available for rental.</p>
            </div>
            <div class="flex gap-3 bg-white/10 p-4 rounded-2xl backdrop-blur-sm border border-white/20">
                <div class="text-center px-4 border-r border-white/20">
                    <p class="text-indigo-100 text-xs font-bold uppercase mb-1">Total</p>
                    <p class="text-white font-extrabold text-xl" th:text="${totalVehicles}">0</p>
                </div>
                <div class="text-center px-4 border-r border-white/20">
                    <p class="text-indigo-100 text-xs font-bold uppercase mb-1">Cars</p>
                    <p class="text-white font-extrabold text-xl" th:text="${carCount}">0</p>
                </div>
                <div class="text-center px-4 border-r border-white/20">
                    <p class="text-indigo-100 text-xs font-bold uppercase mb-1">Bikes</p>
                    <p class="text-white font-extrabold text-xl" th:text="${motorcycleCount}">0</p>
                </div>
                <div class="text-center px-4">
                    <p class="text-indigo-100 text-xs font-bold uppercase mb-1">Avg rate</p>
                    <p class="text-white font-extrabold text-xl" th:text="${#numbers.formatDecimal(avgRate, 1, 2)}">0</p>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${param.error != null and param.error[0] == 'vehicle_in_use'}" class="mb-6 bg-red-50 text-red-700 p-4 rounded-2xl border border-red-200 font-semibold flex items-center gap-2">
        <i class="ph-bold ph-warning-circle text-xl"></i> Cannot delete this vehicle: it is linked to an active booking.
    </div>
    <div class="bg-white border border-slate-200 rounded-3xl p-8 soft-card shadow-lg">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-50 text-gray-500 text-xs uppercase tracking-widest border-b border-slate-200">
                    <th class="py-4 px-6 font-bold">ID</th>
                    <th class="py-4 px-6 font-bold">Type</th>
                    <th class="py-4 px-6 font-bold">Brand</th>
                    <th class="py-4 px-6 font-bold">Model</th>
                    <th class="py-4 px-6 font-bold">Daily rate</th>
                    <th class="py-4 px-6 font-bold">Detail</th>
                    <th class="py-4 px-6 font-bold text-right">Actions</th>
                </tr>
                </thead>
                <tbody class="text-gray-700">
                <tr th:each="v : ${vehicleList}" class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                    <td class="py-5 px-6 font-mono font-bold text-gray-900" th:text="${v.id}">id</td>
                    <td class="py-5 px-6 font-semibold" th:text="${v.vehicleType}">t</td>
                    <td class="py-5 px-6" th:text="${v.brand}">b</td>
                    <td class="py-5 px-6" th:text="${v.model}">m</td>
                    <td class="py-5 px-6 font-bold text-indigo-700" th:text="${#numbers.formatDecimal(v.dailyRate, 1, 2)}">r</td>
                    <td class="py-5 px-6 text-sm text-gray-500" th:text="${v.specificDetail}">d</td>
                    <td class="py-5 px-6 text-right space-x-2">
                        <a th:href="@{/vehicles(action=edit,id=${v.id})}" class="inline-flex items-center gap-1 text-indigo-600 hover:text-indigo-800 font-bold text-sm">
                            <i class="ph-bold ph-pencil-simple"></i> Edit
                        </a>
                        <form th:action="@{/vehicles/{id}/delete(id=${v.id})}" method="post" class="inline m-0" onsubmit="return confirm('Delete this vehicle?');">
                            <button type="submit" class="inline-flex items-center gap-1 text-red-500 hover:text-red-700 font-bold text-sm ml-2">
                                <i class="ph-bold ph-trash"></i> Delete
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${vehicleList == null or vehicleList.isEmpty()}">
                    <td colspan="7" class="py-10 text-center text-gray-500 font-medium">No vehicles in the fleet yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
