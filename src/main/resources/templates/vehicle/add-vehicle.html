<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Add vehicle</title>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
</head>
<body>
<div th:replace="~{layout :: navbar}"></div>
<main class="container">
    <h1>Add vehicle</h1>
    <p th:if="${param.error}" th:text="'Error: ' + ${param.error[0]}">err</p>
    <form class="form-grid" method="post" th:action="@{/vehicles}">
        <label>Brand <input type="text" name="brand" required/></label>
        <label>Model <input type="text" name="model" required/></label>
        <label>Daily rate <input type="number" step="0.01" name="rate" required/></label>
        <label>Type
            <select name="vehicleType">
                <option value="Car">Car</option>
                <option value="Motorcycle">Motorcycle</option>
            </select>
        </label>
        <label>Capacity (doors, cars) <input type="number" name="capacity" value="4"/></label>
        <label><input type="checkbox" name="helmetIncluded"/> Helmet included (motorcycles)</label>
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-ghost" th:href="@{/vehicles}">Cancel</a>
    </form>
</main>
</body>
</html>
