<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/customer-shell :: head(pageTitle='DriveAway | Edit Review')}"></head>
<body class="customer-premium-theme customer-portal-theme">
<div th:replace="~{fragments/customer-shell :: grain}"></div>
<nav th:replace="~{fragments/customer-shell :: topbar(activeNav='reviews')}"></nav>

<main class="cp-shell">
    <section class="cp-page-head reveal">
        <nav class="cp-breadcrumb"><a th:href="@{/customer/reviews}">Reviews</a><i class="ph-bold ph-caret-right"></i><span>Edit</span></nav>
        <h1>Edit review</h1>
        <p>Update your rating, comments, or photo.</p>
    </section>

    <section class="cp-card cp-form-card reveal">
        <div th:if="${param.error != null and param.error[0] == 'missing_fields'}" class="cp-alert cp-alert--error"><span>Please enter a comment before saving.</span></div>

        <form th:action="@{/customer/reviews/{id}(id=${customerReview.id})}" th:object="${customerReview}" method="post" enctype="multipart/form-data" class="cp-form-grid">
            <input type="hidden" name="rating" id="ratingInput" th:value="${customerReview.rating}"/>

            <div class="cp-field cp-field--full">
                <label>Your rating</label>
                <div class="cp-star-picker" id="starPicker" role="group" aria-label="Rating">
                    <span th:each="i : ${#numbers.sequence(1,5)}" class="s" th:classappend="${i <= customerReview.rating} ? ' fill' : ''" th:attr="data-val=${i}">★</span>
                </div>
            </div>

            <div class="cp-field cp-field--full">
                <label for="commentsArea">Comments</label>
                <textarea id="commentsArea" name="comments" rows="6" required maxlength="2000" class="cp-textarea" th:field="*{comments}"></textarea>
            </div>

            <div class="cp-field cp-field--full" th:if="${customerReview.imageUrl != null and !#strings.isEmpty(customerReview.imageUrl)}">
                <label>Current photo</label>
                <img th:src="@{${customerReview.imageUrl}}" alt="Current review photo" class="cp-review-image"/>
            </div>

            <div class="cp-field cp-field--full">
                <label for="image">Replace photo (optional)</label>
                <div class="cp-upload"><input type="file" id="image" name="image" accept="image/*"/></div>
            </div>

            <div class="cp-actions-row cp-field--full">
                <a th:href="@{/customer/reviews}" class="cp-btn-secondary">Cancel</a>
                <button type="submit" class="cp-btn">Save changes</button>
            </div>
        </form>
    </section>
</main>
<script th:src="@{/js/customer-portal.js}"></script>
<script>
(function () {
    var stars = document.querySelectorAll('#starPicker .s');
    var input = document.getElementById('ratingInput');
    function paint(val) {
        stars.forEach(function (s) { s.classList.toggle('fill', parseInt(s.dataset.val, 10) <= val); });
        input.value = val;
    }
    paint(parseInt(input.value, 10) || 5);
    stars.forEach(function (s) { s.addEventListener('click', function () { paint(parseInt(s.dataset.val, 10)); }); });
})();
</script>
</body>
</html>
