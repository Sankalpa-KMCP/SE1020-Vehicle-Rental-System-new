<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit review - DriveAway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/review.css}"/>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen review-customer-page p-6">
<div class="max-w-xl mx-auto">
    <a th:href="@{/customer/reviews}" class="inline-flex items-center gap-2 text-slate-600 font-semibold hover:text-slate-900 mb-8">
        <i class="ph-bold ph-arrow-left"></i> Back to my reviews
    </a>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <h1 class="text-2xl font-bold mb-2 flex items-center gap-2">
            <i class="ph-fill ph-pencil-simple text-amber-500"></i> Edit review
        </h1>
        <p class="text-slate-600 text-sm mb-6">Update your rating or comments. Booking details cannot be changed here.</p>

        <p th:if="${param.error != null and param.error[0] == 'missing_fields'}" class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-red-900 text-sm">
            Please enter comments before saving.
        </p>
        <p th:if="${param.error != null and param.error[0] == 'invalid_rating'}" class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-red-900 text-sm">
            Rating must be between 1 and 5 stars.
        </p>

        <div th:if="${customerReview.bookingId != null and !#strings.isEmpty(customerReview.bookingId)}"
             class="mb-5 rounded-xl bg-slate-50 border border-slate-100 px-4 py-3 text-sm text-slate-600">
            Linked booking: <span class="font-mono font-bold text-slate-900" th:text="${customerReview.bookingId}">id</span>
        </div>

        <form th:action="@{/customer/reviews/{id}(id=${customerReview.id})}" th:object="${customerReview}" method="post" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Rating</label>
                <select th:field="*{rating}" required class="w-full rounded-xl border border-slate-200 px-4 py-3 bg-white">
                    <option value="5">5 — Excellent</option>
                    <option value="4">4 — Good</option>
                    <option value="3">3 — OK</option>
                    <option value="2">2 — Poor</option>
                    <option value="1">1 — Very poor</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Comments</label>
                <textarea name="comments" rows="4" required maxlength="2000" th:field="*{comments}"
                          class="w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none"></textarea>
            </div>

            <div class="flex gap-3 pt-2">
                <a th:href="@{/customer/reviews}" class="w-1/3 text-center rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-3 transition">Cancel</a>
                <button type="submit" class="w-2/3 rounded-xl bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 shadow-sm transition">
                    Save changes
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
