<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Moderate review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#FAFAFA] flex min-h-screen items-center justify-center p-4">
<div class="max-w-lg w-full bg-white p-10 rounded-2xl shadow-lg border-[3px] border-[#475569]">
    <div class="text-center mb-8">
        <i class="ph-fill ph-pencil-simple text-5xl text-[#475569] mb-2"></i>
        <h2 class="text-3xl font-bold text-gray-900 tracking-tight">Moderate Review</h2>
    </div>

    <form th:action="@{/reviews/{id}(id=${customerReview.id})}" method="post" class="space-y-5">
        <input type="hidden" name="reviewType" value="CUSTOMER"/>
        <input type="hidden" name="reviewerName" th:value="${customerReview.reviewerName}"/>
        <input type="hidden" name="rating" th:value="${customerReview.rating}"/>
        <input type="hidden" name="bookingId" th:value="${customerReview.bookingId}"/>
        <input type="hidden" name="vehicleId" th:value="${customerReview.vehicleId}"/>

        <div class="bg-slate-50 p-4 rounded-lg border border-slate-100 mb-4">
            <p class="text-sm text-gray-500 mb-1">Customer: <span class="font-bold text-gray-900" th:text="${customerReview.reviewerName}">name</span></p>
            <p class="text-sm text-gray-500">Rating: <span class="font-bold text-yellow-500">
                <th:block th:each="i : ${#numbers.sequence(1, customerReview.rating)}">⭐</th:block>
            </span></p>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Review Content (Edit if inappropriate):</label>
            <textarea name="comments" rows="4" required class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-[#475569]"
                      th:text="${customerReview.comments}">text</textarea>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Moderation Status:</label>
            <select name="status" class="w-full border border-gray-300 rounded-lg p-3 outline-none">
                <option value="PUBLISHED" th:selected="${customerReview.status == 'PUBLISHED'}">PUBLISHED (Visible to Public)</option>
                <option value="FLAGGED" th:selected="${customerReview.status == 'FLAGGED'}">FLAGGED (Hidden / Under Review)</option>
            </select>
        </div>

        <div th:if="${customerReview.staffReply != null and !#strings.isEmpty(customerReview.staffReply)}"
             class="bg-blue-50 border border-blue-200 rounded-lg p-3">
            <p class="text-xs font-bold text-blue-700 mb-1">Current Staff Reply (<span th:text="${customerReview.repliedBy}">staff</span>)</p>
            <p class="text-sm text-blue-900" th:text="${customerReview.staffReply}">reply</p>
        </div>

        <div class="pt-4 flex gap-3">
            <a th:href="@{/reviews}" class="w-1/3 bg-gray-100 text-gray-700 font-bold py-3 px-4 rounded-lg hover:bg-gray-200 text-center transition">Cancel</a>
            <button type="submit" class="w-2/3 bg-[#475569] text-white font-bold py-3 px-4 rounded-lg hover:bg-slate-800 transition">Save Moderation</button>
        </div>
    </form>
</div>
</body>
</html>
