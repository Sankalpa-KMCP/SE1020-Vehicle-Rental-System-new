<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit Review — DriveAway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #fff7ed 0%, #fef3c7 40%, #fff1f2 100%); min-height:100vh; }

        .page-card { animation: riseUp 0.45s cubic-bezier(0.2,0.8,0.2,1) both; }
        @keyframes riseUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }

        /* ── Star picker ── */
        .star-picker { display:flex; gap:6px; }
        .star-picker .s {
            font-size:2.4rem; cursor:pointer; color:#e2e8f0;
            transition:color 0.15s, transform 0.1s; line-height:1; user-select:none;
        }
        .star-picker .s:hover, .star-picker .s.active { color:#f59e0b; }
        .star-picker .s:active { transform:scale(0.88); }
        .star-label {
            font-size:0.8rem; font-weight:700; color:#92400e;
            background:#fef3c7; border:1px solid #fde68a; border-radius:999px;
            padding:2px 10px; display:inline-block; transition:all 0.2s;
        }

        /* ── Form inputs ── */
        .form-input {
            width:100%; border:1.5px solid #e2e8f0; border-radius:0.875rem;
            padding:11px 16px; font-size:0.9rem; background:#ffffff;
            transition:border-color 0.2s, box-shadow 0.2s; outline:none; color:#1e293b;
        }
        .form-input:focus { border-color:#f97316; box-shadow:0 0 0 3px rgba(249,115,22,0.12); }

        .field-label { display:block; font-size:0.8rem; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px; }

        .notice { border-radius:0.875rem; padding:12px 16px; font-size:0.875rem; font-weight:600; display:flex; align-items:flex-start; gap:10px; }
        .notice-error { background:#fef2f2; border:1.5px solid #fecaca; color:#991b1b; }

        .char-ok   { color:#94a3b8; }
        .char-warn { color:#f59e0b; }
        .char-over { color:#ef4444; }

        .btn-cancel {
            flex:1; text-align:center; padding:13px; border-radius:0.875rem;
            background:#f1f5f9; color:#475569; font-weight:700; font-size:0.9rem;
            border:1.5px solid #e2e8f0; cursor:pointer; transition:background 0.2s; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:6px;
        }
        .btn-cancel:hover { background:#e2e8f0; }
        .btn-save {
            flex:2; padding:13px; border-radius:0.875rem;
            background:linear-gradient(135deg,#f97316,#ef4444); color:#fff;
            font-weight:800; font-size:0.9rem; border:none; cursor:pointer;
            transition:opacity 0.2s, transform 0.15s;
            box-shadow:0 8px 24px rgba(249,115,22,0.3);
            display:flex; align-items:center; justify-content:center; gap:6px;
        }
        .btn-save:hover { opacity:0.92; transform:translateY(-1px); }

        /* Hidden select (Thymeleaf binding) */
        .hidden-select { display:none; }
    </style>
</head>
<body>

<!-- Back nav -->
<div class="max-w-xl mx-auto px-5 pt-8 pb-2">
    <a th:href="@{/customer/reviews}"
       class="inline-flex items-center gap-2 text-slate-500 hover:text-slate-900 font-semibold text-sm transition">
        <i class="ph-bold ph-arrow-left"></i> Back to my reviews
    </a>
</div>

<div class="max-w-xl mx-auto px-5 pb-16">
    <div class="page-card bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">

        <!-- Header -->
        <div class="bg-gradient-to-r from-amber-500 to-orange-500 px-8 py-8 text-white relative overflow-hidden">
            <div class="absolute -right-8 -top-8 w-36 h-36 bg-white/10 rounded-full pointer-events-none"></div>
            <div class="relative z-10">
                <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center mb-4">
                    <i class="ph-fill ph-pencil-simple text-white text-2xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight mb-1">Edit Review</h1>
                <p class="text-amber-100 text-sm font-medium">Update your rating or comments. Booking details cannot be changed.</p>
            </div>
        </div>

        <!-- Body -->
        <div class="px-8 py-7 space-y-6">

            <!-- Booking info chip -->
            <div th:if="${customerReview.bookingId != null and !#strings.isEmpty(customerReview.bookingId)}"
                 class="flex items-center gap-3 rounded-2xl bg-amber-50 border border-amber-200 px-4 py-3">
                <i class="ph-fill ph-receipt text-amber-600 text-lg shrink-0"></i>
                <div>
                    <p class="text-xs font-bold text-amber-700 uppercase tracking-wider">Linked booking</p>
                    <p class="font-mono font-bold text-slate-900 text-sm" th:text="${customerReview.bookingId}">BK-001</p>
                </div>
            </div>

            <!-- Error notices -->
            <div th:if="${param.error != null and param.error[0] == 'missing_fields'}" class="notice notice-error">
                <i class="ph-fill ph-x-circle text-lg shrink-0"></i>
                Please enter a comment before saving.
            </div>
            <div th:if="${param.error != null and param.error[0] == 'invalid_rating'}" class="notice notice-error">
                <i class="ph-fill ph-x-circle text-lg shrink-0"></i>
                Rating must be between 1 and 5 stars.
            </div>

            <form th:action="@{/customer/reviews/{id}(id=${customerReview.id})}"
                  th:object="${customerReview}"
                  method="post"
                  enctype="multipart/form-data"
                  class="space-y-6">

                <!-- Hidden select for Thymeleaf binding -->
                <select th:field="*{rating}" class="hidden-select" id="ratingSelect">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <!-- Visual star picker -->
                <div>
                    <label class="field-label">Your Rating</label>
                    <div class="flex items-center gap-4">
                        <div class="star-picker" id="starPicker" role="group" aria-label="Rating">
                            <span class="s" data-val="1" title="1 — Very poor">★</span>
                            <span class="s" data-val="2" title="2 — Poor">★</span>
                            <span class="s" data-val="3" title="3 — OK">★</span>
                            <span class="s" data-val="4" title="4 — Good">★</span>
                            <span class="s" data-val="5" title="5 — Excellent">★</span>
                        </div>
                        <span class="star-label" id="ratingLabel">5 — Excellent</span>
                    </div>
                </div>

                <!-- Comments -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="field-label mb-0">Comments</label>
                        <span id="charCount" class="text-xs font-semibold char-ok">0 / 2000</span>
                    </div>
                    <textarea id="commentsArea" name="comments" rows="5" required maxlength="2000"
                              th:field="*{comments}"
                              class="form-input resize-none"
                              placeholder="Describe your experience…"></textarea>
                </div>

                <!-- Image Upload -->
                <div>
                    <label for="image" class="field-label">Update Photo (optional)</label>
                    <div th:if="${customerReview.imageUrl != null and !#strings.isEmpty(customerReview.imageUrl)}" class="mb-3">
                        <img th:src="@{${customerReview.imageUrl}}" alt="Current review photo" class="h-24 w-auto rounded-lg border border-slate-200 object-cover"/>
                        <p class="text-xs text-slate-500 mt-1">Uploading a new photo will replace this one.</p>
                    </div>
                    <input type="file" id="image" name="image" accept="image/*" class="form-input p-2 cursor-pointer file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100"/>
                </div>

                <!-- Actions -->
                <div class="flex gap-3 pt-1">
                    <a th:href="@{/customer/reviews}" class="btn-cancel">
                        <i class="ph-bold ph-x"></i> Cancel
                    </a>
                    <button type="submit" class="btn-save">
                        <i class="ph-bold ph-floppy-disk"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const stars     = document.querySelectorAll('#starPicker .s');
    const select    = document.getElementById('ratingSelect');
    const ratingLb  = document.getElementById('ratingLabel');
    const labels    = { 1:'Very poor', 2:'Poor', 3:'OK', 4:'Good', 5:'Excellent' };
    let   current   = parseInt(select.value) || 5;

    function paint(n) {
        stars.forEach(s => s.classList.toggle('active', +s.dataset.val <= n));
        ratingLb.textContent = n + ' — ' + labels[n];
    }
    paint(current);

    stars.forEach(s => {
        s.addEventListener('mouseenter', () => paint(+s.dataset.val));
        s.addEventListener('mouseleave', () => paint(current));
        s.addEventListener('click', () => {
            current = +s.dataset.val;
            select.value = current;
            // Trigger change so Thymeleaf/browser tracks it
            select.dispatchEvent(new Event('change'));
            paint(current);
        });
    });

    // Character counter
    const textarea  = document.getElementById('commentsArea');
    const charCount = document.getElementById('charCount');
    function updateCounter() {
        const n = textarea.value.length;
        charCount.textContent = n + ' / 2000';
        charCount.className = 'text-xs font-semibold ' +
            (n > 1900 ? 'char-over' : n > 1600 ? 'char-warn' : 'char-ok');
    }
    textarea.addEventListener('input', updateCounter);
    updateCounter();
</script>
</body>
</html>
