<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/admin-shell :: adminHead('Review Detail - DriveAway')}"></th:block>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="admin-shell text-gray-800">
<th:block th:replace="~{fragments/admin-shell :: shellOpen('reviews', 'Review Detail')}"></th:block>
<div class="fade-in">

<div th:replace="~{layout :: navbar}"></div>
<h1>Review</h1>
    <dl>
        <dt>ID</dt>
        <dd th:text="${review.id}">-</dd>
        <dt>Type</dt>
        <dd th:text="${review.reviewType}">-</dd>
        <th:block th:if="${review instanceof T(com.sliit.vehiclerentalsystem01.review.model.CustomerReview)}">
            <dt>Status</dt>
            <dd th:text="${review.status}">-</dd>
            <dt>Reviewer</dt>
            <dd th:text="${review.reviewerName}">-</dd>
            <dt>Booking</dt>
            <dd th:text="${review.bookingId}">-</dd>
            <dt>Vehicle</dt>
            <dd th:text="${review.vehicleId}">-</dd>
            <dt>Rating</dt>
            <dd th:text="${review.rating}">-</dd>
            <dt>Comment</dt>
            <dd th:text="${review.comments}">-</dd>
            <dt>Staff reply</dt>
            <dd th:text="${review.staffReply}">-</dd>
            <dt>Replied by</dt>
            <dd th:text="${review.repliedBy}">-</dd>
            <dt>Replied at</dt>
            <dd th:text="${review.repliedAt}">-</dd>
        </th:block>
    </dl>
    <p class="actions">
        <a class="btn btn-ghost" th:href="@{/reviews}">Back</a>
        <a class="btn btn-primary" th:href="@{/reviews/{id}/edit(id=${review.id})}">Edit</a>
    </p>
</div>
<th:block th:replace="~{fragments/admin-shell :: shellClose}"></th:block>
<script th:replace="~{fragments/admin-shell :: mobileScript}"></script>
</body>
</html>
