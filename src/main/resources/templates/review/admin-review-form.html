<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Submit Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #FAFAFA; }
    </style>
</head>
<body class="min-h-screen p-6 relative">
<div class="flex gap-4 mb-8">
    <button type="button" onclick="history.back()" class="flex items-center justify-center gap-2 bg-white px-5 py-2.5 rounded-xl font-bold text-black shadow-sm border border-gray-200 hover:bg-gray-50 transition">
        <span class="text-lg">Back</span>
    </button>
    <a th:href="@{/user/admin-dashboard}" class="flex items-center justify-center gap-2 bg-[#1C2024] px-5 py-2.5 rounded-xl font-bold text-white shadow-sm hover:bg-black transition">
        <i class="ph-fill ph-house text-[#FFD43B] text-2xl"></i>
        <span class="text-lg">Home</span>
    </a>
</div>
<div class="flex justify-center items-center pb-12">
    <div class="w-full max-w-3xl bg-white border-[3px] border-[#475569] rounded-xl p-10 shadow-lg">
        <div class="flex flex-col items-center mb-10">
            <i class="ph-fill ph-star text-[80px] text-[#475569] mb-2"></i>
            <h2 class="text-[40px] font-bold text-[#475569] tracking-tight">Log Customer Review</h2>
        </div>
        <form th:action="@{/reviews}" method="post" class="space-y-6">
            <input type="hidden" name="reviewType" value="CUSTOMER"/>
            <div>
                <label class="block text-gray-900 font-bold mb-2 text-xl">Review ID (Optional):</label>
                <input type="text" name="manualId" class="w-full border border-gray-200 rounded-xl px-4 py-4 focus:outline-none focus:border-[#475569] focus:ring-1 focus:ring-[#475569] text-lg"/>
            </div>
            <div>
                <label class="block text-gray-900 font-bold mb-2 text-xl">Customer Name:</label>
                <input type="text" name="reviewerName" class="w-full border border-gray-200 rounded-xl px-4 py-4 focus:outline-none focus:border-[#475569] focus:ring-1 focus:ring-[#475569] text-lg" required/>
            </div>
            <div>
                <label class="block text-gray-900 font-bold mb-2 text-xl">Rating (1 to 5):</label>
                <select name="rating" class="w-full border border-gray-200 rounded-xl px-4 py-4 appearance-none bg-white text-gray-700 text-lg focus:outline-none focus:border-[#475569] focus:ring-1 focus:ring-[#475569]">
                    <option value="5">5 Stars</option>
                    <option value="4">4 Stars</option>
                    <option value="3">3 Stars</option>
                    <option value="2">2 Stars</option>
                    <option value="1">1 Star</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-900 font-bold mb-2 text-xl">Customer Comments:</label>
                <textarea name="comments" rows="3" class="w-full border border-gray-200 rounded-xl px-4 py-4 focus:outline-none focus:border-[#475569] focus:ring-1 focus:ring-[#475569] text-lg" required></textarea>
            </div>
            <button type="submit" class="w-full bg-[#475569] hover:bg-slate-700 text-white font-bold py-4 rounded-xl text-2xl flex justify-center items-center gap-3 mt-10 shadow-md transition-all">
                <i class="ph-bold ph-chat-circle-text text-3xl"></i> Submit Review
            </button>
        </form>
    </div>
</div>
</body>
</html>
