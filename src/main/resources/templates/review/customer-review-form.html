<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/customer-shell :: head(pageTitle='DriveAway | Write a Review')}"></head>
<body class="customer-premium-theme customer-portal-theme">
<div th:replace="~{fragments/customer-shell :: grain}"></div>
<nav th:replace="~{fragments/customer-shell :: topbar(activeNav='reviews')}"></nav>

<main class="cp-shell">
    <section class="cp-page-head reveal">
        <nav class="cp-breadcrumb"><a th:href="@{/customer/reviews}">Reviews</a><i class="ph-bold ph-caret-right"></i><span>New</span></nav>
        <h1>Write a review</h1>
        <p>Share your rental experience with other DriveAway customers.</p>
    </section>

    <section class="cp-card cp-form-card reveal">
        <div th:if="${param.error != null and param.error[0] == 'missing_fields'}" class="cp-alert cp-alert--error"><span>Please enter a comment before submitting.</span></div>
        <div th:if="${param.error != null and param.error[0] == 'account_limit'}" class="cp-alert cp-alert--warning"><span>You already have a general account review.</span></div>
        <div th:if="${param.error != null and param.error[0] == 'booking_limit'}" class="cp-alert cp-alert--warning"><span>Maximum reviews for this booking reached.</span></div>
        <div th:if="${param.error != null and param.error[0] == 'invalid_booking'}" class="cp-alert cp-alert--error"><span>Booking not found or not linked to your account.</span></div>

        <form th:action="@{/customer/reviews}" method="post" enctype="multipart/form-data" class="cp-form-grid">
            <input type="hidden" name="reviewerName" th:value="${reviewerName}"/>
            <input type="hidden" name="rating" id="ratingInput" value="5"/>

            <div class="cp-field cp-field--full">
                <label for="bookingId">Booking (optional)</label>
                <select id="bookingId" name="bookingId" class="cp-select">
                    <option value="">No booking — general review</option>
                    <option th:each="b : ${customerBookings}" th:value="${b.id}" th:text="${b.id + ' — ' + b.vehicleId + ' (' + b.rentalDate + ')'}">BK</option>
                </select>
            </div>

            <div class="cp-field cp-field--full">
                <label>Your rating</label>
                <div class="cp-star-picker" id="starPicker" role="group" aria-label="Rating">
                    <span class="s fill" data-val="1">★</span><span class="s fill" data-val="2">★</span><span class="s fill" data-val="3">★</span><span class="s fill" data-val="4">★</span><span class="s fill" data-val="5">★</span>
                </div>
                <span id="ratingLabel" class="cp-card__text">5 — Excellent</span>
            </div>

            <div class="cp-field cp-field--full">
                <label for="commentsArea">Comments</label>
                <textarea id="commentsArea" name="comments" rows="6" required maxlength="2000" class="cp-textarea" placeholder="Tell us about your experience…"></textarea>
            </div>

            <div class="cp-field cp-field--full">
                <label for="image">Photo (optional)</label>
                <div class="cp-upload"><input type="file" id="image" name="image" accept="image/*"/></div>
            </div>

            <div class="cp-actions-row cp-field--full">
                <a th:href="@{/customer/reviews}" class="cp-btn-secondary">Cancel</a>
                <button type="submit" class="cp-btn">Publish review</button>
            </div>
        </form>
    </section>
</main>
<script th:src="@{/js/customer-portal.js}"></script>
<script>
(function () {
    var stars = document.querySelectorAll('#starPicker .s');
    var input = document.getElementById('ratingInput');
    var label = document.getElementById('ratingLabel');
    var labels = {1:'Very poor',2:'Poor',3:'OK',4:'Good',5:'Excellent'};
    function paint(val) {
        stars.forEach(function (s) {
            s.classList.toggle('fill', parseInt(s.dataset.val, 10) <= val);
        });
        input.value = val;
        label.textContent = val + ' — ' + labels[val];
    }
    stars.forEach(function (s) {
        s.addEventListener('click', function () { paint(parseInt(s.dataset.val, 10)); });
    });
})();
</script>
</body>
</html>
