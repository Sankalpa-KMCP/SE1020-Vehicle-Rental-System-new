<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/admin-shell :: adminHead('User Detail - DriveAway')}"></th:block>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="admin-shell text-gray-800">
<th:block th:replace="~{fragments/admin-shell :: shellOpen('users', 'User Detail')}"></th:block>
<div class="fade-in">

<div th:replace="~{layout :: navbar}"></div>
<h1>User</h1>
    <div class="mb-6" th:replace="~{fragments/user-avatar :: avatar(user=${user}, size=96)}"></div>
    <dl>
        <dt>ID</dt>
        <dd th:text="${user.id}">-</dd>
        <dt>Username</dt>
        <dd th:text="${user.username}">-</dd>
        <dt>Email</dt>
        <dd th:text="${user.email}">-</dd>
        <dt>Type</dt>
        <dd th:text="${user.userRole}">-</dd>
        <th:block th:if="${user instanceof T(com.sliit.vehiclerentalsystem01.user.entity.Customer)}">
            <dt>Name</dt>
            <dd th:text="${user.name}">-</dd>
            <dt>Phone</dt>
            <dd th:text="${user.phone}">-</dd>
            <dt>Driver license</dt>
            <dd th:text="${user.driverLicense}">-</dd>
        </th:block>
        <th:block th:if="${user instanceof T(com.sliit.vehiclerentalsystem01.user.entity.Staff)}">
            <dt>Name</dt>
            <dd th:text="${user.name}">-</dd>
            <dt>Phone</dt>
            <dd th:text="${user.phone}">-</dd>
            <dt>Role</dt>
            <dd th:text="${user.role}">-</dd>
            <dt>Access</dt>
            <dd th:text="${user.accessLevel}">-</dd>
        </th:block>
    </dl>
    <p class="actions">
        <a class="btn btn-ghost" th:href="@{/users}">Back</a>
        <a class="btn btn-primary" th:href="@{/users/{id}/edit(id=${user.id})}">Edit</a>
    </p>
</div>
<th:block th:replace="~{fragments/admin-shell :: shellClose}"></th:block>
<script th:replace="~{fragments/admin-shell :: mobileScript}"></script>
</body>
</html>
