<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Staff Management - DriveAway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #fef2f2 0%, #f8fafc 45%, #f1f5f9 100%); }</style>
</head>
<body class="min-h-screen pb-12">
<th:block th:replace="~{fragments/layout :: globalPreloader}"></th:block>
<div class="max-w-6xl mx-auto px-6 pt-8">
    <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
        <div class="flex gap-3">
            <button type="button" onclick="history.back()" class="bg-white border border-gray-200 px-4 py-2 rounded-xl font-semibold hover:bg-gray-50 shadow-sm">← Back</button>
            <a th:href="@{/user/admin-dashboard}" class="bg-slate-900 text-white px-5 py-2 rounded-xl font-bold shadow-lg hover:bg-slate-800 transition">Dashboard Home</a>
        </div>
    </div>
    <div class="grid md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white rounded-2xl shadow border border-red-100 p-6 md:col-span-1">
            <p class="text-gray-500 font-bold text-xs uppercase tracking-wider">Total staff</p>
            <h1 class="text-4xl font-extrabold text-red-600 mt-2" th:text="${staffCount}">0</h1>
        </div>
        <div class="bg-gradient-to-br from-red-600 to-rose-700 rounded-2xl shadow-xl p-6 text-white md:col-span-2 flex flex-col justify-center">
            <h2 class="text-2xl font-extrabold">Staff directory</h2>
            <p class="text-red-100 font-medium mt-1">Manage and onboard employees in the system.</p>
        </div>
    </div>
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 mb-8">
        <h3 class="text-lg font-extrabold text-gray-900 mb-4 flex items-center gap-2">
            <i class="ph-bold ph-user-plus text-red-500"></i> Onboard employee
        </h3>
        <form th:action="@{/staff}" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" name="manualId" placeholder="Employee ID (optional — auto if empty)" class="border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-red-400 outline-none md:col-span-2"/>
            <input type="text" name="name" placeholder="Full Name" class="border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-red-400 outline-none" required/>
            <input type="email" name="email" placeholder="Email Address" class="border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-red-400 outline-none" required/>
            <input type="text" name="phone" placeholder="Phone Number" class="border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-red-400 outline-none" required/>
            <input type="text" name="username" placeholder="Username" class="border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-red-400 outline-none" required/>
            <input type="password" name="password" placeholder="Password" class="border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-red-400 outline-none" required/>
            <select name="role" class="border border-gray-200 rounded-xl px-4 py-3 md:col-span-2 focus:ring-2 focus:ring-red-400 outline-none bg-white font-semibold">
                <option value="Support">Support Staff</option>
                <option value="Admin">Admin</option>
            </select>
            <button type="submit" name="action" value="create" class="md:col-span-2 bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl transition flex justify-center items-center gap-2 shadow-lg shadow-red-500/30">
                <i class="ph-bold ph-user-plus"></i> Add Employee
            </button>
        </form>
    </div>
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        <div class="p-5 border-b border-gray-100 bg-slate-50">
            <h3 class="text-xl font-extrabold text-gray-900">Employee list</h3>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-gray-100 text-gray-600 text-xs uppercase tracking-wider">
                <tr>
                    <th class="p-4 font-bold">EMP ID</th>
                    <th class="p-4 font-bold">Name</th>
                    <th class="p-4 font-bold">Email</th>
                    <th class="p-4 font-bold">Phone</th>
                    <th class="p-4 font-bold">Role</th>
                    <th class="p-4 font-bold">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${staffList}" class="border-t border-gray-100 hover:bg-red-50/30 transition">
                    <td class="p-4 font-mono font-bold" th:text="${s.staffId}">id</td>
                    <td class="p-4 font-semibold" th:text="${s.name}">n</td>
                    <td class="p-4 text-sm" th:text="${s.email}">e</td>
                    <td class="p-4 text-sm" th:text="${s.phone}">p</td>
                    <td class="p-4"><span class="bg-slate-100 px-2 py-1 rounded-lg text-xs font-bold" th:text="${s.role}">r</span></td>
                    <td class="p-4">
                        <a th:href="@{/staff(action=edit,id=${s.staffId})}" class="text-blue-600 font-bold text-sm hover:underline">Edit</a>
                        <form th:action="@{/staff}" method="post" class="inline m-0" onsubmit="return confirm('Are you sure?')">
                            <input type="hidden" name="action" value="delete"/>
                            <input type="hidden" name="id" th:value="${s.staffId}"/>
                            <button type="submit" class="text-red-600 font-bold text-sm ml-3 hover:underline">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${staffList == null or staffList.isEmpty()}">
                    <td colspan="6" class="text-center p-8 text-gray-500 font-medium">No staff found in the system.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
