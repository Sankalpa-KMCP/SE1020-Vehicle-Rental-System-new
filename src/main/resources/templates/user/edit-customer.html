<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Edit customer</title>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
</head>
<body>
<div th:replace="~{layout :: navbar}"></div>
<main class="container">
    <h1>Edit customer</h1>
    <p th:if="${param.error}" th:text="${param.error[0]}">err</p>
    <form class="form-grid" method="post" th:action="@{/customers}">
        <input type="hidden" name="action" value="update"/>
        <input type="hidden" name="id" th:value="${customer.id}"/>
        <label>Full name <input type="text" name="name" th:value="${customer.fullName}" required/></label>
        <label>Email <input type="email" name="email" th:value="${customer.email}" required/></label>
        <label>Username <input type="text" name="username" th:value="${customer.username}" required/></label>
        <label>Password <input type="password" name="password" th:value="${customer.password}" required/></label>
        <label>Phone <input type="text" name="phone" th:value="${customer.phone}" required/></label>
        <label>NIC <input type="text" name="nic" th:value="${customer.nic}"/></label>
        <label>License <input type="text" name="license" th:value="${customer.driverLicense}"/></label>
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-ghost" th:href="@{/customers}">Cancel</a>
    </form>
</main>
</body>
</html>
