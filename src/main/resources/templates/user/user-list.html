<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/admin-shell :: adminHead('Users - DriveAway')}"></th:block>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="admin-shell text-gray-800">
<th:block th:replace="~{fragments/admin-shell :: shellOpen('users', 'Users')}"></th:block>
<div class="fade-in">

<div th:replace="~{layout :: navbar}"></div>
<h1>Users</h1>
    <p><a class="btn btn-primary" th:href="@{/users/new}">Add user</a></p>
    <div class="stack">
        <table>
            <thead>
            <tr>
                <th>Avatar</th>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Type</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td><div th:replace="~{fragments/user-avatar :: avatar(user=${u}, size=40)}"></div></td>
                <td th:text="${u.id}">id</td>
                <td th:text="${u.username}">user</td>
                <td th:text="${u.email}">email</td>
                <td th:text="${u.userRole}">TYPE</td>
                <td class="actions">
                    <a class="btn btn-ghost" th:href="@{/users/{id}(id=${u.id})}">View</a>
                    <a class="btn btn-ghost" th:href="@{/users/{id}/edit(id=${u.id})}">Edit</a>
                    <form th:action="@{/users/{id}/delete(id=${u.id})}" method="post" style="display:inline">
                        <button class="btn btn-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<th:block th:replace="~{fragments/admin-shell :: shellClose}"></th:block>
<script th:replace="~{fragments/admin-shell :: mobileScript}"></script>
</body>
</html>
