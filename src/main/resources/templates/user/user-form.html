<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/admin-shell :: adminHead('User Form - DriveAway')}"></th:block>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="admin-shell text-gray-800">
<th:block th:replace="~{fragments/admin-shell :: shellOpen('users', 'User Form')}"></th:block>
<div class="fade-in">

<div th:replace="~{layout :: navbar}"></div>
<h1 th:text="${mode == 'edit'} ? 'Edit user' : 'New user'">User</h1>
    <form class="form-grid user-form" method="post" enctype="multipart/form-data"
          th:action="${entityId != null} ? @{/users/{id}(id=${entityId})} : @{/users}">
        <th:block th:replace="~{fragments/user-avatar :: avatarInput}"></th:block>
        <fieldset>
            <legend>Account type</legend>
            <label><input type="radio" name="userType" value="CUSTOMER" th:checked="${userType == 'CUSTOMER'}"/> Customer</label>
            <label><input type="radio" name="userType" value="STAFF" th:checked="${userType == 'STAFF'}"/> Staff</label>
        </fieldset>
        <div id="customerFields" th:object="${customer}">
            <h2>Customer</h2>
            <label>Full name <input type="text" th:field="*{fullName}" required/></label>
            <label>Username <input type="text" th:field="*{username}" required/></label>
            <label>Password <input type="password" th:field="*{password}" required/></label>
            <label>Email <input type="email" th:field="*{email}" required/></label>
            <label>Phone <input type="text" th:field="*{phone}"/></label>
            <label>Driver license <input type="text" th:field="*{driverLicense}"/></label>
        </div>
        <div id="staffFields" th:object="${staff}">
            <h2>Staff</h2>
            <label>Name <input type="text" th:field="*{name}" required/></label>
            <label>Username <input type="text" th:field="*{username}" required/></label>
            <label>Password <input type="password" th:field="*{password}" required/></label>
            <label>Email <input type="email" th:field="*{email}" required/></label>
            <label>Phone <input type="text" th:field="*{phone}"/></label>
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-ghost" th:href="@{/users}">Cancel</a>
    </form>
</div>
<th:block th:replace="~{fragments/admin-shell :: shellClose}"></th:block>
<script th:replace="~{fragments/admin-shell :: mobileScript}"></script>
<script th:src="@{/js/user.js}"></script>
</body>
</html>
