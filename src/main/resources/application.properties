# Spring Boot Application Configuration
spring.application.name=VehicleRentalSystem01
server.port=8080

# JSP Configuration
# JSPs live under src/main/webapp (e.g. /customer-dashboard.jsp), not under META-INF/resources
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/assets/**

# File Storage Configuration
app.storage.base-path=${user.home}/RentalData

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# Logging Configuration
logging.level.com.example.vehiclerentalsystem01=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Tomcat Configuration
server.tomcat.uri-encoding=UTF-8
server.tomcat.max-http-form-post-size=2MB

# Error Handling
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
