spring.application.name=Vehicle Rental System
server.port=8081
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso

# User/booking data files: folder for *.txt (relative to JVM working directory unless you set an absolute path).
# If login does not see edits to users.txt, check logs for "User store file" and align this path or your IDE working directory.
app.data.directory=data

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB